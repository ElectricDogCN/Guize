$schema: acceptance.schema.yaml
schemaVersion: 1
contractId: ACCEPTANCE-TRACE-V1
status: frozen
authority:
  requirements: specs/requirements/v1/requirements.yaml
  product: specs/requirements/product-requirements.md
acceptances:
- id: ACCEPT-SOURCE-SYNC
  title: 来源同步与增量一致性
  requirementIds: [REQ-V1-0001]
  scenarios:
  - {requirementId: REQ-V1-0001, type: success, given: 合法数据源配置且存在可读取对象, when: 执行首次或增量同步, then: 来源对象以稳定来源标识进入目录且不要求全量复制内容}
  - {requirementId: REQ-V1-0001, type: failure, given: 连接器返回429/5xx或网络中断, when: 同步遇到失败, then: 失败被分类和重试且不产生伪成功或重复目录对象}
  - {requirementId: REQ-V1-0001, type: recovery, given: 同步中途失败且存在检查点, when: 故障恢复后重试, then: 从安全检查点继续或幂等重跑且不静默遗漏对象}
- id: ACCEPT-CONNECTOR-CONTRACT
  title: 统一 Connector 能力合同
  requirementIds: [REQ-V1-0001]
  scenarios:
  - {requirementId: REQ-V1-0001, type: production_gate, given: 一个V1数据源被声明为可发布, when: 执行契约失败路径权限和Evidence检查, then: 只有统一能力矩阵凭据边界和真实Evidence完整时才允许进入生产门禁}
  - {requirementId: REQ-V1-0001, type: failure, given: 接入依赖未批准私有接口或不可维护抓取方式, when: 执行生产接入评审, then: 接入被阻断且POC脚本不得冒充生产实现}
- id: 验收V1-0001
  title: 统一资产归一与版本完整性
  requirementIds: [REQ-V1-0002]
  scenarios:
  - {requirementId: REQ-V1-0002, type: success, given: 同一内容出现移动改名多来源或不同编码实体, when: 执行资产归一和版本判定, then: Asset与SourceObject/AssetVersion/Rendition/Replica关系保持可追溯}
  - {requirementId: REQ-V1-0002, type: failure, given: 哈希来源版本或规则无法证明两个实体相同, when: 尝试自动合并, then: 不得不可逆合并并保留独立实体或进入审查}
  - {requirementId: REQ-V1-0002, type: data_integrity, given: 资产被合并拆分或产生新版本, when: 读取历史和当前关系, then: 历史来源版本和正式副本引用不产生悬空或静默覆盖}
  - {requirementId: REQ-V1-0002, type: production_gate, given: 资产模型准备进入生产, when: 执行移动改名版本重复合并拆分验收, then: 成功和失败场景均有可复现Evidence后才通过}
- id: 验收V1-0002
  title: 权限隔离与受控按需访问
  requirementIds: [REQ-V1-0003, REQ-V1-0008]
  scenarios:
  - {requirementId: REQ-V1-0003, type: success, given: 用户拥有资产权限且源支持Range, when: 请求播放或预览, then: 授权后的Range/缓存链路返回正确版本内容}
  - {requirementId: REQ-V1-0003, type: failure, given: 源站慢断流或Range/ETag条件失效, when: 播放链路遇到故障, then: 返回可观察失败或受控降级且不返回错误版本}
  - {requirementId: REQ-V1-0003, type: permission, given: 请求者无资产权限, when: 请求搜索缩略图播放或缓存资源, then: 标题摘要缩略图和媒体字节均不泄漏}
  - {requirementId: REQ-V1-0008, type: success, given: 请求携带有效身份和权限上下文, when: 访问受控资源, then: IAM/ACL/签名授权按策略放行并产生审计证据}
  - {requirementId: REQ-V1-0008, type: failure, given: 签名过期身份无效或策略不可判定, when: 访问受控资源, then: 默认拒绝且不得降级为匿名放行}
  - {requirementId: REQ-V1-0008, type: permission, given: 无权用户通过索引缓存URL或资源ID探测, when: 访问受控元数据或内容, then: 结果为空或拒绝且权限泄漏为零}
  - {requirementId: REQ-V1-0008, type: data_integrity, given: 权限在索引或缓存生成后变化, when: 再次查询或播放, then: 最终权限复核使用当前策略且旧派生产物不能维持越权访问}
  - {requirementId: REQ-V1-0008, type: production_gate, given: IAM/ACL/匿名/签名路径进入发布候选, when: 执行IDOR ACL签名URL OAuth和缓存隔离测试, then: 无权限泄漏和未处理高风险问题才允许发布}
- id: 验收V1-0003
  title: Range、ATS 与缓存恢复
  requirementIds: [REQ-V1-0003]
  scenarios:
  - {requirementId: REQ-V1-0003, type: recovery, given: ATS源站连接中断或完整缓存未完成, when: 故障恢复或用户重试, then: 从安全边界重试并校验版本哈希且部分内容不标为完整}
  - {requirementId: REQ-V1-0003, type: failure, given: 源对象ETag或版本变化, when: 继续使用旧缓存或If-Range, then: 旧内容不得与新版本拼接且失效过程可观察}
- id: 验收V1-0006
  title: 媒体兼容、AV1/ABR 与临时转码门禁
  requirementIds: [REQ-V1-0003]
  scenarios:
  - {requirementId: REQ-V1-0003, type: production_gate, given: AV1 ABR或A380临时H264被声明为生产能力, when: 执行固定样本质量重试取消清理与产物追踪测试, then: 对应POC和批准质量阈值完成后才可通过}
- id: 验收V1-0007
  title: AI 固定样本与事实边界
  requirementIds: [REQ-V1-0004]
  scenarios:
  - {requirementId: REQ-V1-0004, type: success, given: 批准的媒体图片文档固定样本可用, when: 执行AI流水线, then: 产物模型Prompt参数来源和处理链可追溯}
  - {requirementId: REQ-V1-0004, type: failure, given: 模型超时GPU OOM Provider失败或输出不满足Schema, when: 执行AI任务, then: 任务可重试或降级且失败输出不写成权威事实}
  - {requirementId: REQ-V1-0004, type: data_integrity, given: AI输出修正字幕标签或摘要, when: 写入派生产物, then: 保留原始证据版本和人工干预记录}
  - {requirementId: REQ-V1-0004, type: recovery, given: Worker或Provider中断后恢复, when: 重放长任务, then: 保持幂等和产物版本一致}
  - {requirementId: REQ-V1-0004, type: production_gate, given: AI能力准备发布, when: 按语言质量时长场景运行Golden Dataset, then: 只有GZ-011阈值和POC-09结论满足时通过}
- id: 验收V1-0008
  title: 检索推荐相关性与权限门禁
  requirementIds: [REQ-V1-0005]
  scenarios:
  - {requirementId: REQ-V1-0005, type: success, given: 索引已构建且用户有权限, when: 执行关键词向量混合检索或推荐, then: 返回排序并在最终结果阶段执行ACL复核}
  - {requirementId: REQ-V1-0005, type: failure, given: OpenSearch Milvus或Reranker不可用, when: 执行搜索, then: 按批准路径降级或明确失败且不泄漏数据}
  - {requirementId: REQ-V1-0005, type: permission, given: 索引包含用户无权资产, when: 执行检索或推荐, then: 最终结果不包含受限资产及标题摘要缩略图}
  - {requirementId: REQ-V1-0005, type: recovery, given: 索引损坏或升级后重建, when: 恢复搜索服务, then: 索引可从权威资产数据重建并验证权限一致性}
  - {requirementId: REQ-V1-0005, type: production_gate, given: 相关性能力准备发布, when: 固定查询集测量Recall MRR NDCG, then: GZ-011阈值通过且权限泄漏为零时通过}
- id: 验收V1-0004
  title: 缓存、正式副本与生命周期完整性
  requirementIds: [REQ-V1-0006]
  scenarios:
  - {requirementId: REQ-V1-0006, type: success, given: 对象满足Promotion/Retention且水位允许, when: 创建完整缓存或正式副本, then: 内容经过哈希完整性验证并记录副本状态位置}
  - {requirementId: REQ-V1-0006, type: failure, given: 空间不足哈希不一致或存储断开, when: 执行缓存或副本任务, then: 不完整对象不得标为正式副本且失败可恢复}
  - {requirementId: REQ-V1-0006, type: data_integrity, given: 生命周期策略淘汰缓存或迁移副本, when: 执行删除或迁移, then: 正式副本和保留规则不被静默破坏}
- id: 验收V1-0011
  title: 备份、恢复与关键数据回读
  requirementIds: [REQ-V1-0006, REQ-V1-0010]
  scenarios:
  - {requirementId: REQ-V1-0006, type: recovery, given: 存在PostgreSQL Secrets关键文件和Bundle备份, when: 执行实际恢复演练, then: 恢复数据可读取且与备份点一致}
  - {requirementId: REQ-V1-0006, type: production_gate, given: 备份恢复能力准备发布, when: 执行POC-10和批准恢复验收, then: 实际恢复回读限制和失败替代均有Evidence后通过}
  - {requirementId: REQ-V1-0010, type: success, given: 生产治理资产具有备份审计恢复信息, when: 执行受控恢复, then: 恢复操作可审计且关键数据配置可验证回读}
  - {requirementId: REQ-V1-0010, type: recovery, given: 数据库Secrets关键文件或Bundle不可用, when: 执行灾难恢复, then: 按批准流程恢复并记录实际RPO/RTO且未实测值不得宣称达标}
- id: 验收V1-0009
  title: 规则模拟、冲突与发布
  requirementIds: [REQ-V1-0007]
  scenarios:
  - {requirementId: REQ-V1-0007, type: success, given: 规则草稿通过Schema和权限验证, when: 执行模拟或受控运行, then: 决策结果具有规则版本输入输出审计}
  - {requirementId: REQ-V1-0007, type: failure, given: 规则冲突表达式错误或脚本越权, when: 尝试发布或执行, then: 失败闭合并阻断发布}
  - {requirementId: REQ-V1-0007, type: data_integrity, given: 规则触发数据变更或任务创建, when: 提交结果, then: 幂等键来源事件和执行版本可追溯}
- id: 验收V1-0010
  title: Temporal 长任务可恢复语义
  requirementIds: [REQ-V1-0007]
  scenarios:
  - {requirementId: REQ-V1-0007, type: recovery, given: Worker消失Temporal重启网络中断或任务取消, when: 恢复或重放Workflow, then: 按Retry Timeout Heartbeat Cancellation契约恢复且副作用幂等}
  - {requirementId: REQ-V1-0007, type: production_gate, given: 长任务进入生产, when: 执行重试取消Worker离线和故障注入, then: 失败路径可恢复可观察且不阻塞核心浏览播放时通过}
- id: 验收V1-0012
  title: 配置、部署、供应链与生产发布
  requirementIds: [REQ-V1-0009, REQ-V1-0010]
  scenarios:
  - {requirementId: REQ-V1-0009, type: success, given: 配置规则模型或部署变更形成草稿, when: 执行验证模拟审批灰度发布, then: 每一步有版本审批审计和回滚点}
  - {requirementId: REQ-V1-0009, type: failure, given: 验证审批灰度或健康检查失败, when: 尝试继续发布, then: 发布被阻断或回滚到已知良好版本}
  - {requirementId: REQ-V1-0009, type: data_integrity, given: 升级或配置变更影响数据Schema, when: 执行迁移或部署, then: 迁移和回滚可验证且不允许无正式Migration的数据行为}
  - {requirementId: REQ-V1-0009, type: recovery, given: 新配置或部署造成服务异常, when: 执行回滚, then: 恢复到批准版本并保留失败Evidence}
  - {requirementId: REQ-V1-0009, type: production_gate, given: 候选版本申请正式发布, when: 执行签名SBOM许可证Bundle和回滚验证, then: 全部批准门禁通过后才能进入GZ-020}
  - {requirementId: REQ-V1-0010, type: failure, given: 关键监控审计恢复或供应链Evidence缺失, when: 申请生产发布, then: 发布失败闭合且口头确认不能替代Evidence}
  - {requirementId: REQ-V1-0010, type: permission, given: Agent或操作员尝试绕过审批权限直接修改生产, when: 执行变更, then: 操作被阻断或要求人工批准且尝试进入审计}
  - {requirementId: REQ-V1-0010, type: data_integrity, given: 配置规则模型任务部署或数据变化发生, when: 查询审计链, then: 能关联主体版本输入结果和回滚恢复证据}
  - {requirementId: REQ-V1-0010, type: production_gate, given: V1申请正式发布, when: 检查范围能力漏洞恢复播放AI文档制品和人工签署, then: V1无对外Beta且所有门禁及OPS-001关闭后才允许发布}
