$schema: https://json-schema.org/draft/2020-12/schema
$id: acceptance.schema.yaml
title: Guize V1 Requirement Acceptance
type: object
additionalProperties: false
required: [$schema, schemaVersion, contractId, status, authority, acceptances]
properties:
  $schema: {const: acceptance.schema.yaml}
  schemaVersion: {const: 1}
  contractId: {const: ACCEPTANCE-TRACE-V1}
  status: {const: frozen}
  authority:
    type: object
    additionalProperties: false
    required: [requirements, product]
    properties:
      requirements: {const: specs/requirements/v1/requirements.yaml}
      product: {const: specs/requirements/product-requirements.md}
  acceptances: {type: array, minItems: 1, items: {$ref: '#/$defs/acceptance'}}
$defs:
  acceptance:
    type: object
    additionalProperties: false
    required: [id, title, requirementIds, scenarios]
    properties:
      id: {type: string, minLength: 1}
      title: {type: string, minLength: 1}
      requirementIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, pattern: '^REQ-V1-[0-9]{4}$'}}
      provenance:
        type: object
        additionalProperties: false
        required: [type, source]
        properties:
          type: {const: PROGRAM_SUPPLEMENT}
          source: {const: specs/coordination/program-plan.yaml}
      scenarios: {type: array, minItems: 1, items: {$ref: '#/$defs/scenario'}}
  scenario:
    type: object
    additionalProperties: false
    required: [requirementId, type, given, when, then]
    properties:
      requirementId: {type: string, pattern: '^REQ-V1-[0-9]{4}$'}
      type: {enum: [success, failure, permission, data_integrity, recovery, production_gate]}
      given: {type: string, minLength: 3}
      when: {type: string, minLength: 2}
      then: {type: string, minLength: 3}
