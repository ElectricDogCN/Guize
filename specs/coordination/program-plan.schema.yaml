$schema: https://json-schema.org/draft/2020-12/schema
$id: https://guize.local/schemas/program-plan.schema.yaml
title: Guize V1 Program Plan
type: object
additionalProperties: false
required:
  - $schema
  - schemaVersion
  - planId
  - status
  - baseline
  - sourceOfTruth
  - authority
  - parallelPolicy
  - foundationTasks
  - waves
  - pocs
  - tasks
  - externalBlockers
  - releasePolicy
allOf:
  - if:
      properties:
        status: {const: frozen}
    then:
      required: [recovery]
properties:
  $schema:
    type: string
    const: program-plan.schema.yaml
  schemaVersion:
    type: integer
    const: 1
  planId:
    type: string
    pattern: '^[A-Z][A-Z0-9-]+$'
  status:
    enum: [draft, active, frozen, completed, deprecated]
  recovery:
    type: object
    additionalProperties: false
    required: [taskId, reason, affectedTasks, sourceCommit, frozenAt, verificationPath]
    properties:
      taskId: {$ref: '#/$defs/taskId'}
      reason: {type: string, minLength: 12}
      affectedTasks:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/taskId'}
      sourceCommit: {type: string, pattern: '^[0-9a-f]{40}$'}
      frozenAt: {type: string, format: date-time}
      verificationPath: {type: string, pattern: '^evidence/[A-Z]+-[0-9]+/[^\\]+\.json$'}
  baseline:
    type: string
    pattern: '^[A-Z]+-[0-9]{3}$'
  sourceOfTruth:
    const: specs/coordination/program-plan.yaml
  authority:
    type: object
    additionalProperties: false
    required: [requirements, requirementIndex, moduleOwnership, collaborationProtocol]
    properties:
      requirements: {type: string, minLength: 1}
      requirementIndex: {type: string, minLength: 1}
      moduleOwnership: {type: string, minLength: 1}
      collaborationProtocol: {type: string, minLength: 1}
  parallelPolicy:
    type: object
    additionalProperties: false
    required: [maxActiveTasks, maxHighRiskTasks, criticalStandalone, reservationRequired, independentReviewForHighRisk]
    properties:
      maxActiveTasks: {const: 3}
      maxHighRiskTasks: {const: 1}
      criticalStandalone: {const: true}
      reservationRequired: {const: true}
      independentReviewForHighRisk: {const: true}
  foundationTasks:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/foundationTask'}
  waves:
    type: array
    minItems: 1
    items: {$ref: '#/$defs/wave'}
  pocs:
    type: array
    minItems: 10
    maxItems: 10
    items: {$ref: '#/$defs/poc'}
  tasks:
    type: array
    minItems: 1
    items:
      oneOf:
        - {$ref: '#/$defs/task'}
        - {$ref: '#/$defs/edgeTask'}
  scopeBoundary: {$ref: '#/$defs/fixedScopeBoundary'}
  planningBaselines:
    type: array
    minItems: 1
    uniqueItems: true
    items: {$ref: '#/$defs/planningBaseline'}
  externalBlockers:
    type: array
    items: {$ref: '#/$defs/blocker'}
  releasePolicy:
    type: object
    additionalProperties: false
    required: [noPublicBeta, productionApprovalRequired, allInScopeCapabilitiesMustPass, requiredFinalTask]
    properties:
      noPublicBeta: {const: true}
      productionApprovalRequired: {const: true}
      allInScopeCapabilitiesMustPass: {const: true}
      requiredFinalTask:
        type: string
        pattern: '^[A-Z]+-[0-9]{3}$'
$defs:
  taskId:
    type: string
    pattern: '^[A-Z]+-[0-9]{3}$'
  reqId:
    type: string
    pattern: '^REQ-V1-[0-9]{4}$'
  moduleId:
    type: string
    pattern: '^MOD-[A-Z0-9]+(?:-[A-Z0-9]+)*$'
  path:
    type: string
    minLength: 1
    not:
      enum: ['*', '**', '/']
  foundationTask:
    type: object
    additionalProperties: false
    required: [taskId, title, status, completionRef, mergeCommit]
    properties:
      taskId: {$ref: '#/$defs/taskId'}
      title: {type: string, minLength: 1}
      status:
        enum: [reserved, completed, in_progress, review, integration, blocked]
      completionRef: {type: string, minLength: 1}
      mergeCommit:
        type: [string, 'null']
        pattern: '^[0-9a-f]{40}$'
  wave:
    type: object
    additionalProperties: false
    required: [id, order, name, maxConcurrent, maxHighRisk]
    properties:
      id: {type: string, pattern: '^W[0-9]+$'}
      order: {type: integer, minimum: 1}
      name: {type: string, minLength: 1}
      maxConcurrent: {type: integer, minimum: 1, maximum: 10}
      maxHighRisk: {type: integer, minimum: 0, maximum: 3}
  poc:
    type: object
    additionalProperties: false
    required: [pocId, taskId, title, status, riskLevel, requirementIds, moduleIds, evidencePath]
    properties:
      pocId: {type: string, pattern: '^POC-[0-9]{2}$'}
      taskId: {type: string, pattern: '^POC-[0-9]{3}$'}
      title: {type: string, minLength: 1}
      status:
        enum: [planned, reserved, in_progress, review, integration, completed, blocked, cancelled]
      riskLevel:
        enum: [low, medium, high, critical]
      requirementIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/reqId'}
      moduleIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/moduleId'}
      evidencePath:
        type: string
        pattern: '^evidence/POC-[0-9]{3}$'
  task:
    type: object
    additionalProperties: false
    required: [taskId, title, kind, status, workPackage, riskLevel, ownerRole, reviewerRole, coordinationGroup, wave, integrationOrder, dependsOn, requirementIds, moduleIds, outputPaths, sharedPaths, producesContracts, consumesContracts, acceptanceIds, pocIds, issue, branchPattern, exitGate]
    properties:
      taskId: {$ref: '#/$defs/taskId'}
      title: {type: string, minLength: 1}
      kind:
        enum: [requirements, contract, design-contract, poc-coordination, poc, acceptance, scaffold, vertical-slice, release, governance]
      status:
        enum: [planned, reserved, in_progress, review, integration, completed, blocked, cancelled]
      workPackage: {type: string, minLength: 1}
      riskLevel:
        enum: [low, medium, high, critical]
      ownerRole: {type: string, minLength: 1}
      reviewerRole: {type: string, minLength: 1}
      coordinationGroup: {type: string, minLength: 1}
      wave: {type: string, pattern: '^W[0-9]+$'}
      integrationOrder: {type: integer, minimum: 1}
      dependsOn:
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/taskId'}
      requirementIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/reqId'}
      moduleIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/moduleId'}
      outputPaths:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/path'}
      sharedPaths:
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/path'}
      producesContracts:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      consumesContracts:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      acceptanceIds:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      pocIds:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^POC-[0-9]{2}$'}
      issue:
        type: [integer, 'null']
        minimum: 1
      branchPattern:
        type: string
        pattern: '^(feat|fix|docs|refactor|chore)/[A-Z]+-[0-9]{3}-\*$'
      exitGate: {type: string, minLength: 10}
  planningBaseline:
    type: object
    additionalProperties: false
    required: [id, taskId, requiredBy]
    properties:
      id: {type: string, pattern: '^[A-Z][A-Z0-9-]+$'}
      taskId: {$ref: '#/$defs/taskId'}
      requiredBy:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/taskId'}
  blocker:
    type: object
    additionalProperties: false
    required: [id, title, status, issue, requiredFor, verification]
    properties:
      id: {type: string, minLength: 1}
      title: {type: string, minLength: 1}
      status:
        enum: [open, resolved, waived]
      issue:
        type: [integer, 'null']
        minimum: 1
      requiredFor:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/taskId'}
      verification:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}

  edgeReqId:
    type: string
    pattern: ^REQ-EDGE-104-[0-9]{4}$
  edgeTask:
    type: object
    additionalProperties: false
    required:
    - taskId
    - title
    - kind
    - status
    - workPackage
    - riskLevel
    - ownerRole
    - reviewerRole
    - coordinationGroup
    - wave
    - integrationOrder
    - dependsOn
    - requirementIds
    - moduleIds
    - outputPaths
    - sharedPaths
    - producesContracts
    - consumesContracts
    - acceptanceIds
    - pocIds
    - issue
    - branchPattern
    - exitGate
    properties:
      taskId:
        $ref: '#/$defs/taskId'
      title:
        type: string
        minLength: 1
      kind:
        enum:
        - requirements
        - contract
        - design-contract
        - poc-coordination
        - poc
        - acceptance
        - scaffold
        - vertical-slice
        - release
        - governance
      status:
        enum:
        - planned
        - reserved
        - in_progress
        - review
        - integration
        - completed
        - blocked
        - cancelled
      workPackage:
        type: string
        minLength: 1
      riskLevel:
        enum:
        - low
        - medium
        - high
        - critical
      ownerRole:
        type: string
        minLength: 1
      reviewerRole:
        type: string
        minLength: 1
      coordinationGroup:
        type: string
        minLength: 1
      wave:
        type: string
        pattern: ^W[0-9]+$
      integrationOrder:
        type: integer
        minimum: 1
      dependsOn:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/taskId'
      requirementIds:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/edgeReqId'
      moduleIds:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/moduleId'
      outputPaths:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/path'
      sharedPaths:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/path'
      producesContracts:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      consumesContracts:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      acceptanceIds:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      pocIds:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^POC-[0-9]{2}$
      issue:
        type:
        - integer
        - 'null'
        minimum: 1
      branchPattern:
        type: string
        pattern: ^(feat|fix|docs|refactor|chore)/[A-Z]+-[0-9]{3}-\*$
      exitGate:
        type: string
        minLength: 10
  agentEdge104Scope:
    type: object
    additionalProperties: false
    required:
    - id
    - sourceIssue
    - state
    - planningTaskId
    - taskIds
    - requiredFinalTask
    - requirements
    - requirementIndex
    - acceptanceIndex
    properties:
      id:
        const: AGENT-EDGE-104
      sourceIssue:
        const: 104
      state:
        enum:
        - planning
        - defined
      planningTaskId:
        const: GZ-022
      taskIds:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/taskId'
      requiredFinalTask:
        anyOf:
        - $ref: '#/$defs/taskId'
        - type: 'null'
      requirements:
        const: specs/requirements/agent-edge-104.md
      requirementIndex:
        const: specs/requirements/agent-edge-104.yaml
      acceptanceIndex:
        const: specs/acceptance/agent-edge-104.yaml
    allOf:
    - if:
        properties:
          state:
            const: planning
      then:
        properties:
          taskIds:
            const:
            - GZ-022
          requiredFinalTask:
            type: 'null'
    - if:
        properties:
          state:
            const: defined
      then:
        properties:
          taskIds:
            minItems: 2
            contains:
              const: GZ-022
          requiredFinalTask:
            allOf:
            - $ref: '#/$defs/taskId'
            - not:
                const: GZ-022
  agentEdge104Planning:
    allOf:
    - $ref: '#/$defs/agentEdge104Scope'
    - properties:
        state:
          const: planning
  agentEdge104Defined:
    allOf:
    - $ref: '#/$defs/agentEdge104Scope'
    - properties:
        state:
          const: defined
  fixedScopeBoundary:
    type: object
    additionalProperties: false
    required:
    - v1TaskIds
    - v1FinalTask
    - agentEdge104
    properties:
      v1TaskIds:
        const:
        - GZ-004
        - GZ-005
        - GZ-006
        - GZ-007
        - GZ-008
        - GZ-009
        - GZ-010
        - POC-001
        - POC-002
        - POC-003
        - POC-004
        - POC-005
        - POC-006
        - POC-007
        - POC-008
        - POC-009
        - POC-010
        - GZ-011
        - GZ-012
        - GZ-013
        - GZ-015
        - GZ-016
        - GZ-017
        - GZ-018
        - GZ-019
        - GZ-020
        - GZ-021
      v1FinalTask:
        const: GZ-020
      agentEdge104:
        $ref: '#/$defs/agentEdge104Scope'
