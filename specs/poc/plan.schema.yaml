$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
- schemaVersion
- pocId
- taskId
- title
- status
- resultStatus
- riskLevel
- wave
- dependsOn
- requirementIds
- moduleIds
- evidencePath
- resourceIds
- sampleIds
- environment
- protocol
- security
- decision
- review
properties:
  schemaVersion:
    const: 1
  pocId:
    type: string
    pattern: ^POC-[0-9]{2}$
  taskId:
    type: string
    pattern: ^POC-[0-9]{3}$
  title:
    type: string
    minLength: 1
  status:
    enum:
    - planned
    - ready
    - running
    - blocked
    - completed
    - cancelled
  resultStatus:
    enum:
    - not_started
    - running
    - pass
    - fail
    - inconclusive
    - blocked
    - cancelled
  riskLevel:
    enum:
    - low
    - medium
    - high
    - critical
  wave:
    type: string
    pattern: ^W[0-9]+$
  dependsOn:
    type: array
    uniqueItems: true
    items:
      type: string
  requirementIds:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^REQ-V1-[0-9]{4}$
  moduleIds:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^MOD-[A-Z0-9-]+$
  evidencePath:
    type: string
    pattern: ^evidence/POC-[0-9]{3}$
  resourceIds:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^RES-[A-Z0-9-]+$
  sampleIds:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: ^SAMPLE-[A-Z0-9-]+$
  environment:
    type: object
    additionalProperties: false
    required:
    - captureBeforeExecution
    - capturedValues
    properties:
      captureBeforeExecution:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
      capturedValues:
        type: object
  protocol:
    type: object
  security:
    type: object
    additionalProperties: false
    required:
    - dataClassification
    - sampleApprovalRequired
    - credentialsStoredInRepository
    - privacyReviewRequired
    - licenseReviewRequired
    properties:
      dataClassification:
        enum:
        - non-sensitive
        - de-identified
      sampleApprovalRequired:
        const: true
      credentialsStoredInRepository:
        const: false
      privacyReviewRequired:
        type: boolean
      licenseReviewRequired:
        type: boolean
  decision:
    type: object
    additionalProperties: false
    required:
    - status
    - rationale
    - resultRef
    properties:
      status:
        enum:
        - not_evaluated
        - pass
        - fail
        - inconclusive
        - blocked
      rationale:
        type:
        - string
        - 'null'
      resultRef:
        type:
        - string
        - 'null'
  review:
    type: object
    additionalProperties: false
    required:
    - reviewer
    - approvedAt
    - approval
    properties:
      reviewer:
        type:
        - string
        - 'null'
      approvedAt:
        type:
        - string
        - 'null'
      approval:
        type:
        - string
        - 'null'
