$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
- schemaVersion
- pocId
- taskId
- type
- subjectVersion
- decision
- reviewer
- approvedAt
- scope
properties:
  schemaVersion: {const: 1}
  pocId:
    type: string
    pattern: ^POC-[0-9]{2}$
  taskId:
    type: string
    pattern: ^POC-[0-9]{3}$
  type:
    enum: [privacy, license]
  subjectVersion:
    type: string
    minLength: 1
  decision:
    const: approved
  reviewer:
    type: string
    minLength: 1
  approvedAt:
    type: string
    format: date-time
  scope:
    type: string
    minLength: 1
