schemaVersion: 1
taskId: GZ-010
executionAllowedInGz010: false
sampleExecutionRequiresApproval: true
canonicalPlansImmutable: true
cataloguesImmutableInPocTasks: true
terminalEvidenceMustExist: true
terminalReviewRoleBound: true
highCriticalIsolation: true
criticalStandalone: true
maxConcurrentHighCritical: 1
secretPolicy: Secrets, credentials, tokens and private keys must never be committed; use runtime references outside repository.
dataPolicy: Only approved non-sensitive, synthetic or de-identified samples may be executed; approval identity/checksum is recorded in task-owned Evidence, never written back into the GZ-010 catalogue.
rawEvidencePolicy: Raw experiment evidence belongs only under the independent POC task evidence path and terminal references must resolve to existing regular files.
environmentCapturePolicy: Required OS/tool/driver/runtime/model/input provenance values must be nonempty and non-placeholder before terminal acceptance.
commandRecordingPolicy: Canonical plans stay command-free; executing POC tasks record commands only in their task-owned execution record.
measurementPolicy: Canonical plan actual values stay null; executing POC tasks record finite numeric or boolean measurements in Evidence.
reviewPolicy: Terminal results must use the Program Plan reviewerRole and must differ from the executor/owner role.
decisionPolicy: Prose alone cannot establish PASS; existing raw Evidence, complete measurements and approved independent result records are mandatory.
requirementsPolicy: POC results cannot silently modify frozen product requirements; requirement changes use a separate governed task.
