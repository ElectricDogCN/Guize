  measurements:
  - id: range_correctness
    metric: HTTP Range correctness
    unit: percent
    method: Replay deterministic byte-range matrix and compare returned bytes.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: etag_semantics
    metric: ETag stability and validator correctness
    unit: boolean
    method: Verify stable ETag behavior for unchanged objects and validator change when the governed object version changes.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: if_range_semantics
    metric: If-Range conditional Range correctness
    unit: boolean
    method: Verify matching If-Range returns the requested partial response while stale/nonmatching validators fall back to the correct full representation
      semantics.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: ats_slice_behavior
    metric: ATS Slice behavior is correct for large objects
    unit: boolean
    method: Exercise the approved Slice configuration and verify byte coverage, segment boundaries and reassembly against the immutable sample.
    thresholdSource: APPROVED_POC_SCOPE
    actual: null
  - id: source_update_invalidation
    metric: Source updates invalidate or version cache state correctly
    unit: boolean
    method: Change the governed source version and verify stale ETag, Range and Slice objects cannot be returned as the new version.
    thresholdSource: APPROVED_POC_SCOPE
    actual: null
  - id: origin_interruption_recovery
    metric: Interrupted origin stream retries safely
    unit: boolean
    method: Interrupt the origin during a partial response and require bounded retry or explicit failure without publishing a complete-cache success.
    thresholdSource: ACCEPTANCE_TRACE_V1
    actual: null
  - id: partial_cache_integrity
    metric: Partial cache content is never treated as complete
    unit: boolean
    method: Inspect cache metadata and subsequent reads after interruption to prove partial bytes are isolated, discarded or resumed safely.
    thresholdSource: ACCEPTANCE_TRACE_V1
    actual: null
  - id: cache_hit_observation
    metric: Cache-hit behavior is observed and attributable
    unit: boolean
    method: Repeat the approved request matrix and capture cache-status/header/log evidence that distinguishes miss, fill and hit.
    thresholdSource: APPROVED_POC_SCOPE
    actual: null
  - id: cache_disk_observation
    metric: Cache-disk allocation and cleanup are observed
    unit: boolean
    method: Capture disk usage and object lifecycle before, during and after the large-file Slice tests.
    thresholdSource: APPROVED_POC_SCOPE
    actual: null
  - id: cache_key_isolation
    metric: ACL/cache-key isolation
    unit: boolean
    method: Verify distinct authorization contexts do not share protected cache objects.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: large_file_streaming
    metric: Large-file streaming stability
    unit: boolean
    method: Exercise representative large-file slices with raw headers/log capture.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: range_hot_cache_latency
    metric: Range first-byte latency on hot cache
    unit: ms
    method: Measure the approved byte-range matrix after cache warmup with percentile method and request count recorded.
    thresholdSource: NFR-V1-PERF-002
    actual: null
  - id: range_cold_cache_latency
    metric: Range first-byte latency on cold cache
    unit: ms
    method: Purge the approved sandbox cache, then measure cold-fill Range first-byte latency using the same immutable sample.
    thresholdSource: NFR-V1-PERF-002
    actual: null
  - id: range_slow_origin_latency
    metric: Range first-byte latency with controlled slow origin
    unit: ms
    method: Apply the approved origin delay/bandwidth profile and measure end-to-end Range first-byte latency and timeout behavior.
    thresholdSource: NFR-V1-PERF-002
    actual: null
  - id: range_multi_user_latency
    metric: Range latency under approved multi-user load
    unit: ms
    method: Measure authorized Range latency under the frozen concurrent-user profile while preserving cache-key isolation.
    thresholdSource: NFR-V1-PERF-002
    actual: null
  exitCriteria:
  - Range responses match requested byte intervals.
  - ETag validators remain stable for unchanged content and change when the governed object version changes.
  - If-Range requests return correct partial/full behavior for matching and stale validators.
  - ATS Slice returns complete, byte-correct content and records cache hit/disk behavior.
  - Source version changes prevent stale cached objects from masquerading as the new version.
  - Origin interruption never promotes partial content to a complete cache entry and bounded recovery behavior is evidenced.
  - Protected cache keys remain isolated by authorization context.
  - Representative large files stream without full-object materialization.
  - Hot-cache, cold-cache, slow-origin and multi-user Range latency are measured separately under the frozen NFR-V1-PERF-002 scenarios.
  failureFallbacks:
  - If ATS Range/Slice/recovery behavior is insufficient, evaluate origin Range proxy or an alternative edge cache configuration.
  rollbackCleanup:
  - Stop test workloads and remove temporary test artifacts.
  - Restore sandbox configuration to the pre-POC snapshot or document irrecoverable drift.
  - Do not delete governance/Evidence history.
