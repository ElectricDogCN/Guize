  - id: cross_user_cache_isolation
    metric: Cross-user cache leakage prevented
    unit: boolean
    method: Alternate authorized test identities with different ACL outcomes through the same tunnel/CDN/cache path and prove one identity cannot receive another identity's protected payload.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: rate_limit_enforced
    metric: Public-path rate limiting rejects excess requests predictably
    unit: boolean
    method: Exceed the approved request-rate threshold and verify deterministic throttling without bypass, protected payload leakage or unbounded origin amplification.
    thresholdSource: APPROVED_POC_SCOPE
    actual: null
  exitCriteria:
  - TLS/IPv6 path is reproducible.
  - The approved high-port route and DDNS update path work without exposing unintended listeners or stale routing.
  - Authorized Range and representative large-file streaming survive the tunnel/CDN path.
  - Unauthorized and expired authorization requests fail closed with no protected payload leakage.
  - Cross-user cache isolation prevents ACL bypass through the public path.
  - Public-path rate limits reject excess traffic predictably.
  failureFallbacks:
  - If direct IPv6/CDN path fails, document tunnel/reverse-proxy alternative and operational constraints.
  - If any authorization, cache-isolation or rate-limit gate fails, block the public access design until corrected and retested.
  rollbackCleanup:
  - Stop test workloads and remove temporary test artifacts.
  - Restore sandbox configuration to the pre-POC snapshot or document irrecoverable drift.
  - Do not delete governance/Evidence history.
