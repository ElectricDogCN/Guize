    metric: Required language, media-quality, duration and scenario strata are covered
    unit: boolean
    method: Prove every frozen evaluation stratum has the required sample count and metric results.
    thresholdSource: ACCEPTANCE_TRACE_V1
    actual: null
  exitCriteria:
  - AI task quality, throughput, cost, privacy and license evidence is captured with model, Prompt, parameter and immutable-input provenance.
  - Retrieval Recall, MRR, NDCG and end-to-end query latency are measured against one approved fixed query/corpus fixture.
  - External provider usage is gated by approved privacy/data policy, caller permission and the current asset ACL before dispatch.
  - Hard budget, request-rate and concurrency quotas reject excess external-provider use without executing a provider request.
  - No commercial-provider credential or sensitive payload is committed to Git/Evidence.
  - The tested numeric budget, request-rate and concurrency ceilings are recorded and the corresponding fail-closed gates are exercised against
    those values.
  - WER, CER, DER, COMET, BLEU, OCR accuracy, factual consistency, tag F1, thumbnail human selection and multimodal correction are recorded for
    all required language, quality, duration and scenario strata.
  failureFallbacks:
  - Prefer local/private inference or disable a capability when privacy/license/cost/access-control/quota constraints are not acceptable.
  - If retrieval relevance or query latency is insufficient, document the corpus/index/query changes required before product implementation.
  - If a fail-closed permission/ACL/budget/quota gate cannot be demonstrated, external provider use remains disabled.
  rollbackCleanup:
  - Stop test workloads and remove temporary test artifacts.
  - Revoke temporary runtime credentials outside the repository and clear transient provider-side test artifacts where supported.
  - Restore sandbox configuration to the pre-POC snapshot or document irrecoverable drift.
  - Do not delete governance/Evidence history.
