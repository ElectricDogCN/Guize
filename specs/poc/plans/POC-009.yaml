  measurements:
  - id: quality_score
    metric: AI task quality score
    unit: score
    method: Run the approved fixed de-identified benchmark with complete model, Prompt, parameter and sample provenance.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: fixed_query_set_bound
    metric: Retrieval evaluation is bound to the approved fixed query/sample set
    unit: boolean
    method: Record the immutable query-set and corpus/sample identifiers and require every relevance and latency result to reference them.
    thresholdSource: NFR-V1-PERF-003
    actual: null
  - id: retrieval_recall
    metric: Retrieval Recall on the approved fixed query set
    unit: ratio
    method: Compute Recall against independently labelled relevant results for the immutable query/corpus fixture.
    thresholdSource: NFR-V1-PERF-003
    actual: null
  - id: retrieval_mrr
    metric: Retrieval mean reciprocal rank
    unit: ratio
    method: Compute MRR from the same immutable query/corpus fixture and relevance judgements.
    thresholdSource: NFR-V1-PERF-003
    actual: null
  - id: retrieval_ndcg
    metric: Retrieval normalized discounted cumulative gain
    unit: ratio
    method: Compute NDCG from graded relevance judgements on the approved fixed query set.
    thresholdSource: NFR-V1-PERF-003
    actual: null
  - id: query_latency
    metric: End-to-end retrieval query latency
    unit: ms
    method: Measure query latency under the approved local/provider profile with warmup, sample count and percentile method recorded.
    thresholdSource: NFR-V1-PERF-003
    actual: null
  - id: throughput
    metric: Inference throughput
    unit: items/s
    method: Measure approved local/provider profiles with complete model/runtime/provenance capture.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: cost_estimate
    metric: External provider cost estimate
    unit: currency_per_1000_items
    method: Calculate only from approved provider pricing and measured token/item usage under the tested quota configuration.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: license_privacy_pass
    metric: License/privacy policy compatibility
    unit: boolean
    method: Review license terms and data handling constraints before external invocation.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: caller_permission_gate
    metric: Caller permission gate rejects unauthorized commercial-provider invocation
    unit: boolean
    method: Exercise authorized and unauthorized caller identities and verify fail-closed provider dispatch before any external request.
    thresholdSource: NFR_SECURITY_GATE
    actual: null
  - id: asset_acl_gate
    metric: Current asset ACL gate rejects provider invocation without current access
    unit: boolean
    method: Change/revoke asset access in the sandbox and verify the current ACL is re-evaluated before external dispatch.
    thresholdSource: NFR_SECURITY_GATE
    actual: null
  - id: hard_budget_gate
    metric: Hard budget quota blocks over-budget invocation
    unit: boolean
    method: Configure a sandbox budget ceiling and verify requests exceeding the remaining budget fail closed without provider execution.
    thresholdSource: NFR_BUDGET_GATE
    actual: null
  - id: request_quota_gate
    metric: Hard request-rate quota blocks excess requests
    unit: boolean
    method: Exceed the configured request quota and verify deterministic rejection/backoff without bypass.
    thresholdSource: NFR_BUDGET_GATE
    actual: null
  - id: concurrency_quota_gate
    metric: Hard concurrency quota blocks excess concurrent provider calls
    unit: boolean
    method: Exceed the configured concurrent-call ceiling and verify fail-closed admission control.
    thresholdSource: NFR_BUDGET_GATE
    actual: null
  - id: provider_budget_limit
    metric: Tested external-provider budget ceiling
    unit: currency
    method: Record the approved numeric budget ceiling and period used by the hard-budget gate.
    thresholdSource: NFR-V1-CAP-004
    actual: null
  - id: provider_request_rate_limit
    metric: Tested external-provider request-rate ceiling
    unit: requests_per_minute
    method: Record the approved numeric request-rate ceiling exercised by the quota gate.
    thresholdSource: NFR-V1-CAP-004
    actual: null
  - id: provider_concurrency_limit
    metric: Tested external-provider concurrency ceiling
    unit: requests
