  measurements:
  - id: file_count
    metric: Representative source file count
    unit: files
    method: Count immutable metadata records in the approved source/synthetic hierarchy and retain the enumeration manifest reference.
    thresholdSource: NFR_MEASUREMENT_REQUIRED
    actual: null
  - id: directory_count
    metric: Representative directory count
    unit: directories
    method: Count directory nodes from the same immutable hierarchy used for file-count and scan tests.
    thresholdSource: NFR_MEASUREMENT_REQUIRED
    actual: null
  - id: directory_depth_max
    metric: Maximum observed directory depth
    unit: levels
    method: Compute maximum path depth from the approved hierarchy manifest.
    thresholdSource: NFR_MEASUREMENT_REQUIRED
    actual: null
  - id: average_file_size
    metric: Average file size for the representative source population
    unit: bytes
    method: Calculate from approved metadata size fields or immutable synthetic fixture metadata without transferring production payload.
    thresholdSource: NFR_MEASUREMENT_REQUIRED
    actual: null
  - id: source_api_quota
    metric: Source API/listing quota or rate-limit characteristic
    unit: requests_per_minute
    method: Record the documented or sandbox-observed listing/request quota for the tested source adapter profile, including reset/backoff semantics.
    thresholdSource: NFR_MEASUREMENT_REQUIRED
    actual: null
  - id: enumeration_rate
    metric: Metadata enumeration rate
    unit: objects/s
    method: Scan synthetic/approved representative hierarchy and record rate.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: incremental_scan_cost
    metric: Incremental scan cost
    unit: s
    method: Replay controlled change sets and measure incremental traversal.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: memory_peak
    metric: Scanner peak memory
    unit: MiB
    method: Capture process peak memory during scale sweeps.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  exitCriteria:
  - File count, directory count/depth, average file size and source API quota/rate-limit facts are captured for the immutable representative hierarchy/source profile.
  - Scale model covers file count, directory fanout/depth and change rate with raw manifest/provenance references.
  - Enumeration rate, incremental scan cost and memory peak are measured without assuming 700TB byte transfer.
  failureFallbacks:
  - If direct full enumeration is infeasible or source quotas dominate cost, evaluate incremental journals/change tokens, adaptive backoff or staged indexing.
  rollbackCleanup:
  - Stop test workloads and remove temporary test artifacts.
  - Restore sandbox configuration to the pre-POC snapshot or document irrecoverable drift.
  - Do not delete governance/Evidence history.
