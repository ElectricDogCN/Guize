    measurements:
    - id: sequential_throughput
      metric: Sequential throughput
      unit: MB/s
      method: Measure controlled local OpenList sandbox read/write throughput with exact backing directory and request path
        recorded.
      thresholdSource: POC_EXIT_CRITERIA
      actual: null
    - id: io_latency
      metric: Storage I/O latency under approved workload
      unit: ms
      method: Measure latency on the same bounded OpenList sandbox and request path; retain workload and distribution method.
      thresholdSource: POC_EXIT_CRITERIA
      actual: null
    - id: watermark_behavior
      metric: Watermark enforcement
      unit: boolean
      method: Drive controlled capacity thresholds and observe lifecycle behavior.
      thresholdSource: POC_EXIT_CRITERIA
      actual: null
    - id: concurrent_workload_stability
      metric: Storage remains stable under concurrent/multi-task workload
      unit: boolean
      method: Run the approved concurrent read/write and lifecycle workload while capturing throughput, latency, errors and
        recovery behavior.
      thresholdSource: APPROVED_POC_SCOPE
      actual: null
    - id: failure_recovery
      metric: General failure recovery success
      unit: boolean
      method: Inject the remaining approved sandbox failure cases and verify the documented recovery runbook.
      thresholdSource: POC_EXIT_CRITERIA
      actual: null
    - id: incomplete_replica_rejected
      metric: Incomplete object is rejected as a formal replica
      unit: boolean
      method: Interrupt or truncate the copy and prove it cannot be promoted to formal-replica state.
      thresholdSource: ACCEPTANCE_TRACE_V1
      actual: null
    - id: hash_mismatch_replica_rejected
      metric: Hash-mismatched object is rejected as a formal replica
      unit: boolean
      method: Introduce a deterministic checksum mismatch and prove promotion fails closed with auditable evidence.
      thresholdSource: ACCEPTANCE_TRACE_V1
      actual: null
    - id: cache_eviction_preserves_authoritative_state
      metric: Cache eviction preserves asset metadata, retention and formal replicas
      unit: boolean
      method: Evict the cache copy and verify authoritative asset metadata, retention state and formal-replica records remain
        unchanged.
      thresholdSource: ACCEPTANCE_TRACE_V1
      actual: null
    - id: replica_migration_preserves_old_valid_copy
      metric: Replica migration retains the old valid copy until the new copy is verified
      unit: boolean
      method: Migrate a sandbox replica and prove the prior valid copy remains available until checksum and metadata verification
        complete.
      thresholdSource: ACCEPTANCE_TRACE_V1
      actual: null
    - id: local_authenticated_reads
      metric: Authorized reads succeed and unauthorized reads fail closed
      unit: boolean
      method: Read through the configured authenticated OpenList path; verify valid credentials succeed and missing or invalid credentials cannot read the same sandbox objects.
      thresholdSource: ADR-0015_LOCAL_VALIDATION
      actual: null
    - id: local_range_correctness
      metric: Authenticated Range responses exactly match requested byte intervals
      unit: boolean
      method: Exercise bounded, suffix and unsatisfiable ranges through the authenticated sandbox path; compare status, headers and returned bytes against the source.
      thresholdSource: ADR-0015_LOCAL_VALIDATION
      actual: null
    - id: local_read_hash_verified
      metric: Complete authenticated reads match source content hashes
      unit: boolean
      method: Read each approved sandbox sample through OpenList and compare its complete content hash to the independently recorded source hash.
      thresholdSource: ADR-0015_LOCAL_VALIDATION
      actual: null
    - id: local_capacity_reservations_preserved
      metric: local capacity reservations preserved
      unit: boolean
      method: Configure a positive local free-space floor and high/low watermarks, account for in-flight output reservations,
        fill the disposable sandbox and prove admission/eviction keeps the configured floor. Record actual byte values.
      thresholdSource: NFR-V1-CAP-005
      actual: null
    - id: openlist_disconnect_recovery
      metric: openlist disconnect recovery
      unit: boolean
      method: Interrupt OpenList requests and restart the sandbox service; recover with bounded retries and integrity checks
        without promoting partial copies.
      thresholdSource: ADR-0015_LOCAL_VALIDATION
      actual: null
    - id: local_backup_restore_verified
      metric: local backup restore verified
      unit: boolean
      method: Back up and restore disposable local data plus governed metadata; compare hashes and state. This is not a ZFS
        snapshot claim.
      thresholdSource: ADR-0015_LOCAL_VALIDATION
      actual: null
    - id: local_minimum_free_bytes
      metric: local minimum free bytes
      unit: bytes
      method: Record minimum free bytes observed across the actual fill/admission/eviction/recovery run; bind the positive
        configured floor and free-space watermarks in profile configuration.
      thresholdSource: ADR-0015_LOCAL_VALIDATION
      actual: null
    - id: local_maximum_reserved_bytes
      metric: local maximum reserved bytes
      unit: bytes
      method: Record maximum in-flight output reservations over the same observation interval; minimum free minus maximum
        reserved must preserve the configured floor for PASS.
      thresholdSource: ADR-0015_LOCAL_VALIDATION
      actual: null
    exitCriteria:
    - Record actual local throughput, latency, capacity, reservations and watermark configuration.
    - Disconnect, backup/restore, concurrent workload and failure recovery pass on the disposable OpenList sandbox.
    - Retained incomplete/hash-mismatch, cache eviction and safe migration gates all pass.
    - No local result substitutes for the production 500 GiB floor, TrueNAS/iSCSI/ZFS or 700 TB capacity obligations.
    failureFallbacks:
    - Reduce local concurrency/cache budget or reject admission; preserve logical assets and verified formal replicas.
    rollbackCleanup:
    - Stop test requests and remove only disposable local sandbox objects.
    - Restore the local service configuration and retain raw recovery evidence.
  reason: Local execution measures only the captured sandbox; all shared security and integrity gates remain required. Production
    resource obligations remain in the original protocol.
