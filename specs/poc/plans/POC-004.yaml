protocol:
  commands: []
  rawOutputRefs: []
  measurements:
  - id: iscsi_transport_ready
    metric: iSCSI transport path is operational
    unit: boolean
    method: Establish the approved sandbox iSCSI path, verify target/LUN discovery, session stability and read/write accessibility with raw session
      evidence.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: sequential_throughput
    metric: Sequential throughput
    unit: MB/s
    method: Run controlled read/write workload against the approved iSCSI-backed sandbox dataset.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: io_latency
    metric: Storage I/O latency under approved workload
    unit: ms
    method: Capture read/write latency distribution for the same sandbox workload and transport profile used for throughput measurement.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: minimum_free_space_gib
    metric: Minimum observed free capacity during the workload
    unit: GiB
    method: Sample dataset/pool free capacity throughout fill, watermark, recovery and cleanup phases and retain the minimum observation.
    thresholdSource: NFR-V1-CAP-002
    actual: null
  - id: free_space_floor_preserved
    metric: Frozen 500 GiB free-space floor remains preserved
    unit: boolean
    method: Verify the minimum observed free capacity never drops below 500 GiB and that the lifecycle/watermark action engages before violation.
    thresholdSource: NFR-V1-CAP-002
    actual: null
  - id: watermark_behavior
    metric: Watermark enforcement
    unit: boolean
    method: Drive controlled capacity thresholds and observe lifecycle behavior.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: disconnect_recovery
    metric: iSCSI/network disconnect recovery succeeds
    unit: boolean
    method: Interrupt the approved sandbox transport and verify bounded reconnect, integrity checks and explicit failure handling for incomplete
      work.
    thresholdSource: APPROVED_POC_SCOPE
    actual: null
  - id: snapshot_restore
    metric: ZFS snapshot restore recovers expected data and metadata
    unit: boolean
    method: Create an approved sandbox snapshot, mutate the fixture, restore the snapshot and verify checksums plus dataset metadata.
    thresholdSource: APPROVED_POC_SCOPE
    actual: null
  - id: concurrent_workload_stability
    metric: Storage remains stable under concurrent/multi-task workload
    unit: boolean
    method: Run the approved concurrent read/write and lifecycle workload while capturing throughput, latency, errors and recovery behavior.
    thresholdSource: APPROVED_POC_SCOPE
    actual: null
  - id: failure_recovery
    metric: General failure recovery success
    unit: boolean
    method: Inject the remaining approved sandbox failure cases and verify the documented recovery runbook.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: incomplete_replica_rejected
    metric: Incomplete object is rejected as a formal replica
    unit: boolean
    method: Interrupt or truncate the copy and prove it cannot be promoted to formal-replica state.
    thresholdSource: ACCEPTANCE_TRACE_V1
    actual: null
  - id: hash_mismatch_replica_rejected
    metric: Hash-mismatched object is rejected as a formal replica
    unit: boolean
    method: Introduce a deterministic checksum mismatch and prove promotion fails closed with auditable evidence.
    thresholdSource: ACCEPTANCE_TRACE_V1
    actual: null
  - id: cache_eviction_preserves_authoritative_state
    metric: Cache eviction preserves asset metadata, retention and formal replicas
    unit: boolean
    method: Evict the cache copy and verify authoritative asset metadata, retention state and formal-replica records remain unchanged.
    thresholdSource: ACCEPTANCE_TRACE_V1
    actual: null
  - id: replica_migration_preserves_old_valid_copy
    metric: Replica migration retains the old valid copy until the new copy is verified
    unit: boolean
    method: Migrate a sandbox replica and prove the prior valid copy remains available until checksum and metadata verification complete.
    thresholdSource: ACCEPTANCE_TRACE_V1
    actual: null
  exitCriteria:
  - Approved iSCSI transport is reproducibly discoverable and operational for the sandbox dataset.
  - Throughput and I/O latency measurements are captured on that iSCSI path with the environment/profile recorded.
  - Minimum observed free capacity is recorded and remains at or above the frozen 500 GiB floor.
  - Dataset/watermark behavior engages before the free-space floor is violated.
  - Transport disconnect/recovery, ZFS snapshot restore and concurrent workload stability are demonstrated independently.
  - Failure-recovery evidence is captured without production data.
  - Incomplete and hash-mismatched copies cannot be promoted to formal replicas.
  - Cache eviction preserves authoritative asset metadata, retention state and formal replicas.
  - Replica migration retains the old valid copy until the new copy is verified.
  failureFallbacks:
  - If current TrueNAS/iSCSI topology is insufficient, document required dataset/network/storage changes before M2.
  rollbackCleanup:
  - Stop test workloads and remove temporary test artifacts.
  - Close sandbox iSCSI sessions and restore the pre-POC target/LUN configuration.
  - Restore sandbox configuration to the pre-POC snapshot or document irrecoverable drift.
  - Do not delete governance/Evidence history.
