- SAMPLE-MEDIA-CLEAR
environment:
  captureBeforeExecution:
  - host_os
  - kernel
  - cpu
  - memory
  - gpu
  - driver
  - runtime
  - tool_versions
  - network_profile
  - storage_profile
  - worker_node_inventory
  - physical_host_scope
  - encoder_capability_matrix
  - segment_profile
  - scheduler_configuration
  capturedValues: {}
protocol:
  commands: []
  rawOutputRefs: []
  measurements:
  - id: av1_quality
    metric: AV1 quality score
    unit: VMAF
    method: Encode the approved immutable media sample and calculate VMAF against the exact input bytes identified by the
      execution record.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: encode_throughput
    metric: Concurrent encode throughput
    unit: streams
    method: Run controlled concurrency sweep with fixed input identity, tool versions and exact encoder parameters recorded
      in task Evidence.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: first_segment_latency
    metric: First segment generation latency
    unit: ms
    method: Measure from job start to first playable segment with the same recorded encoder configuration.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: sustained_encode_stability
    metric: Sustained encoding stability over the approved soak window
    unit: boolean
    method: Run the approved long-duration AV1/H.264 soak workload and require no unrecovered encoder/runtime failure, GPU
      hang, corrupt segment, or uncontrolled resource growth.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: sustained_encode_duration
    metric: Observed sustained encode duration
    unit: minutes
    method: Record the continuous validated soak duration from raw execution timestamps.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: encode_provenance_complete
    metric: Input/output hashes and exact encoder parameters captured
    unit: boolean
    method: Require execution-record provenance input_sha256, output_sha256 and exact structured encoder_parameters, and verify
      the output hash against the produced media bytes.
    thresholdSource: POC_EXIT_CRITERIA
    actual: null
  - id: disallowed_input_targets_denied
    metric: Disallowed FFmpeg protocols, paths and proxy targets are rejected
    unit: boolean
    method: Exercise the frozen denied protocol/path/proxy matrix and require fail-closed rejection before reading input or
      writing output.
    thresholdSource: ACCEPTANCE_TRACE_V1
    actual: null
  - id: resource_limits_enforced
    metric: CPU, memory, execution-time, temporary-space and output-size limits are enforced
    unit: boolean
    method: Exceed each approved sandbox limit independently and require deterministic termination plus bounded cleanup Evidence.
    thresholdSource: ACCEPTANCE_TRACE_V1
    actual: null
  - id: worker_interruption_idempotent_recovery
    metric: Interrupted worker attempt recovers idempotently
    unit: boolean
    method: Interrupt the worker after partial output creation, retry the same job identity and prove no duplicate terminal
      result or corrupt artifact is published.
    thresholdSource: ACCEPTANCE_TRACE_V1
    actual: null
  - id: cancellation_cleanup_complete
    metric: Cancellation stops work and cleans partial artifacts
    unit: boolean
    method: Cancel an active encode and verify the worker terminates, releases resources and removes or quarantines partial
      output according to policy.
    thresholdSource: ACCEPTANCE_TRACE_V1
    actual: null
  - id: a380_range_first_byte_latency
    metric: A380-backed Range first-byte latency
    unit: ms
    method: Measure first-byte latency for approved Range requests whose media output was produced by the recorded A380 encoder
      path.
    thresholdSource: NFR-V1-PERF-002
    actual: null
  - id: encoder_power_peak_watts
    metric: Peak encoder power during the approved workload
    unit: W
    method: Capture device/host power telemetry with tool version, sampling interval and workload phase recorded.
    thresholdSource: APPROVED_POC_SCOPE
    actual: null
  - id: encoder_temperature_peak_celsius
    metric: Peak encoder temperature during the approved workload
    unit: celsius
    method: Capture device temperature telemetry across warmup, concurrency and soak phases with the sampling method recorded.
    thresholdSource: APPROVED_POC_SCOPE
    actual: null
  - id: parallel_av1_concat_decodes
    metric: parallel av1 concat decodes
    unit: boolean
    method: Encode contiguous spans on the actual nodes in one admitted compatibility group; compare init/config, timing,
      frame counts and whole-asset decode across boundaries. Record audio and no-audio scope separately. Execute and retain
      evidence on the captured production worker pool; a local-profile result cannot satisfy this measurement.
    thresholdSource: NFR-V1-COMP-003
    actual: null
  - id: hls_ready_only_contiguous
    metric: hls ready only contiguous
    unit: boolean
    method: Complete segments out of order; serve only a contiguous READY playback window with immutable init/version and
      no holes or premature ENDLIST. Execute and retain evidence on the captured production worker pool; a local-profile result
      cannot satisfy this measurement.
    thresholdSource: NFR-V1-COMP-003
    actual: null
  - id: attempt_fencing_single_publish
    metric: attempt fencing single publish
    unit: boolean
    method: Expire an attempt, retry, then deliver duplicate/late/cancelled completions; only the current fenced attempt may
      publish READY once. Execute and retain evidence on the captured production worker pool; a local-profile result cannot
      satisfy this measurement.
    thresholdSource: NFR-V1-COMP-003
    actual: null
  - id: playback_priority_reserved_capacity
    metric: playback priority reserved capacity
    unit: boolean
    method: Saturate background jobs then enqueue authorized playback demand; measure admission/first-ready latency and prove
      reserved capacity, aging and source/H.264 fallback. Do not claim running FFmpeg is preempted. Execute and retain evidence
      on the captured production worker pool; a local-profile result cannot satisfy this measurement.
    thresholdSource: NFR-V1-COMP-003
    actual: null
  - id: seek_epoch_rejects_stale_demand
    metric: seek epoch rejects stale demand
    unit: boolean
    method: Seek or revoke playback while work is queued/running; stale demand cannot consume new reserved slots or expose
      protected bytes. Execute and retain evidence on the captured production worker pool; a local-profile result cannot satisfy
      this measurement.
    thresholdSource: NFR-V1-COMP-003
    actual: null
  - id: hls_acl_and_revocation
    metric: hls acl and revocation
    unit: boolean
    method: Test manifest, init, segment and cache-hit authorization, cross-user isolation, expired/revoked grants and direct-origin
      denial. Execute and retain evidence on the captured production worker pool; a local-profile result cannot satisfy this
      measurement.
    thresholdSource: NFR-V1-COMP-003
    actual: null
  exitCriteria:
  - AV1 and fallback H.264 paths produce decodable outputs.
  - Quality/throughput/first-segment measurements are captured for approved immutable samples.
  - Sustained encoding completes the approved soak window without unrecovered runtime/GPU failure or corrupt output.
  - Input SHA-256, output SHA-256 and exact encoder parameters are recorded in task-owned Evidence and are sufficient to reproduce
    the compared encode.
  - Disallowed protocols, paths and proxy targets are rejected before access.
  - CPU, memory, time, temporary-space and output-size limits terminate excess work predictably.
  - Worker interruption retry is idempotent, and cancellation leaves no publishable partial artifact or leaked resource.
  - A380-backed Range first-byte latency is measured with the encoder provenance and public/origin path recorded.
  - Peak encoder power and temperature are recorded across warmup, concurrency and soak phases.
  - Preserve every original A380/ESXi measurement and exit criterion; additionally pass NFR-V1-COMP-003 heterogeneous production
    measurements using actual version-bound pool evidence. Do not reuse local-profile results.
  failureFallbacks:
  - If A380 AV1 path or sustained stability is insufficient, retain H.264 compatibility path and evaluate another worker/GPU
    profile.
  rollbackCleanup:
  - Stop test workloads and remove temporary test artifacts.
  - Restore sandbox configuration to the pre-POC snapshot or document irrecoverable drift.
  - Do not delete governance/Evidence history.
