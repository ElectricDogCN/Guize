  exitCriteria:
  - A legal documented integration path is identified or explicitly rejected with evidence.
  - No scraping/bypass or credential embedding is required.
  - Privacy and license reviews are approved for the exact API/SDK version actually tested.
  - 429, 5xx and network failures are classified and recover through bounded retry without duplicate logical objects.
  - Interrupted synchronization resumes from a safe checkpoint or reruns idempotently.
  - Source deletion preserves the logical asset and records governed source-unavailable state.
  failureFallbacks:
  - If no supportable API exists, treat Baidu connector as blocked/optional and document manual/export alternative.
  rollbackCleanup:
  - Stop test workloads and remove temporary test artifacts.
  - Restore sandbox configuration to the pre-POC snapshot or document irrecoverable drift.
  - Do not delete governance/Evidence history.
