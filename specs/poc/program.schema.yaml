    additionalProperties: false
    required: [schemaVersion, kind, context, identity, observerBuild, processId, argv, startedAt, finishedAt, exitCode,
      outputArtifactRef, outputSha256, stdoutRef, stdoutSha256, remainingProcessIds, windowCompletedAt, samples, events]
    properties:
      schemaVersion: {const: 1}
      kind: {const: media_soak_runtime_capture}
      context: {type: object, minProperties: 1}
      identity: {type: object, minProperties: 1}
      observerBuild: {type: string, minLength: 1}
      processId: {type: string, pattern: '^[1-9][0-9]{0,9}$'}
      argv:
        type: array
        minItems: 1
        maxItems: 128
        items: {type: string, minLength: 1}
      startedAt: {type: string, format: date-time}
      finishedAt: {type: string, format: date-time}
      exitCode: {type: integer}
      outputArtifactRef: {type: string, minLength: 1}
      outputSha256: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      stdoutRef: {type: string, minLength: 1}
      stdoutSha256: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      remainingProcessIds:
        type: array
        minItems: 0
        maxItems: 128
        items: {type: string, pattern: '^[1-9][0-9]{0,9}$'}
      windowCompletedAt: {type: string, format: date-time}
      samples:
        type: array
        minItems: 2
        maxItems: 128
        items:
          type: object
          additionalProperties: false
          required: [observedAt, userCpuSeconds, systemCpuSeconds, residentBytes, processState, files, progressEnd]
          properties:
            observedAt: {type: string, format: date-time}
            userCpuSeconds: {type: number, minimum: 0}
            systemCpuSeconds: {type: number, minimum: 0}
            residentBytes: {type: integer, minimum: 0}
            processState: {enum: [running, exited]}
            files:
              type: array
              minItems: 0
              maxItems: 10000
              items:
                type: object
                additionalProperties: false
                required: [path, area, byteCount]
                properties:
                  path: {type: string, minLength: 1}
                  area: {enum: [temporary, output]}
                  byteCount: {type: integer, minimum: 0}
            progressEnd: {type: integer, minimum: 1}
      events:
        type: array
        minItems: 0
        maxItems: 1024
        items:
          oneOf:
          - type: object
            additionalProperties: false
            required: [type, eventId, kind, observedAt]
            properties: {type: {const: fault}, eventId: {type: string, minLength: 1}, kind: {enum: [gpu_hang, corrupt_segment,
                  encoder, runtime]}, observedAt: {type: string, format: date-time}}
          - type: object
            additionalProperties: false
            required: [type, eventId, observedAt]
            properties: {type: {const: recovered}, eventId: {type: string, minLength: 1}, observedAt: {type: string,
                format: date-time}}
