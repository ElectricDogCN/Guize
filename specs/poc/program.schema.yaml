          type: object
          additionalProperties: false
          required:
          - nodeId
          - outputArtifactRef
          - outputSha256
          - sourceStartFrame
          - sourceEndFrame
          properties:
            nodeId:
              type: string
              minLength: 1
            outputArtifactRef:
              type: string
              minLength: 1
            outputSha256:
              type: string
              pattern: ^sha256:[a-f0-9]{64}$
            sourceStartFrame:
              type: integer
