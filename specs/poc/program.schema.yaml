$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
- schemaVersion
- contractId
- status
- taskId
- sourceProgramPlan
- policyFile
- resourceCatalog
- sampleCatalog
- resultsIndex
- executionRecordSchema
- resultRecordSchema
- sampleApprovalSchema
- complianceReviewSchema
- executionRecordTemplate
- resultRecordTemplate
- sampleApprovalTemplate
- complianceReviewTemplate
- planFiles
- executionEnabled
- notes
- acceptanceProfileBinding
- profileEvidenceBinding
properties:
  schemaVersion:
    const: 2
  contractId:
    const: POC-PROTOCOL-V1
  status:
    enum:
    - defined
    - frozen
    - deprecated
  taskId:
    const: GZ-010
  sourceProgramPlan:
    const: specs/coordination/program-plan.yaml
  policyFile:
    const: policy.yaml
  resourceCatalog:
    const: resources.yaml
  sampleCatalog:
    const: samples.yaml
  resultsIndex:
    const: results-index.yaml
  executionRecordSchema:
    const: execution-record.schema.yaml
  resultRecordSchema:
    const: result-record.schema.yaml
  sampleApprovalSchema:
    const: sample-approval.schema.yaml
  complianceReviewSchema:
    const: compliance-review.schema.yaml
  executionRecordTemplate:
    const: templates/execution-record.yaml
  resultRecordTemplate:
    const: templates/result-record.yaml
  sampleApprovalTemplate:
    const: templates/sample-approval.yaml
  complianceReviewTemplate:
    const: templates/compliance-review.yaml
  planFiles:
    type: array
    minItems: 10
    maxItems: 10
    uniqueItems: true
    items:
      type: string
      pattern: ^plans/POC-[0-9]{3}\.yaml$
  executionEnabled:
    const: false
  notes:
    type: string
    minLength: 1
  acceptanceProfileBinding:
    type: object
    additionalProperties: false
    required:
    - revision
    - authorityTask
    - decisionRef
    - profiles
    properties:
      revision:
        const: 1
      authorityTask:
        const: GZ-021
      decisionRef:
        const: adr/0015-heterogeneous-av1-workers-and-local-storage-validation.md
      profiles:
        type: array
        minItems: 2
        maxItems: 2
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - version
          - scope
          - milestoneTask
          - canSatisfyProductionGate
          - requirementIds
          - acceptanceIds
          properties:
            id:
              enum:
              - local-v1
              - production
            version:
              const: 1
            scope:
              enum:
              - LOCAL_FULL_V1
              - PRODUCTION_RELEASE
            milestoneTask:
              enum:
              - GZ-018
              - GZ-020
            canSatisfyProductionGate:
              type: boolean
            requirementIds:
              type: array
              minItems: 10
              maxItems: 10
              uniqueItems: true
              items:
                enum:
                - REQ-V1-0001
                - REQ-V1-0002
                - REQ-V1-0003
                - REQ-V1-0004
                - REQ-V1-0005
                - REQ-V1-0006
                - REQ-V1-0007
                - REQ-V1-0008
                - REQ-V1-0009
                - REQ-V1-0010
            acceptanceIds:
              type: array
              minItems: 12
              maxItems: 12
              uniqueItems: true
              items:
                type: string
                minLength: 1
          allOf:
          - if:
              properties:
                id:
                  const: local-v1
            then:
              properties:
                scope:
                  const: LOCAL_FULL_V1
                milestoneTask:
                  const: GZ-018
                canSatisfyProductionGate:
                  const: false
          - if:
              properties:
                id:
                  const: production
            then:
              properties:
                scope:
                  const: PRODUCTION_RELEASE
                milestoneTask:
                  const: GZ-020
                canSatisfyProductionGate:
                  const: true
  profileEvidenceBinding:
    type: object
    additionalProperties: false
    required:
    - revision
    - legacyResultIndexPurpose
    - localOwner
    - productionOwner
    - localIndexPattern
    - productionIndexPattern
    - indexSchema
    - productionExecutionSchema
    - productionResultSchema
    - productionSampleApprovalSchema
    - productionComplianceSchema
    - resourceConfigurationSchema
    - resourceBookingSchema
    - executionWindowSchema
    - measurementDomainReviewSchema
    - testedSourceSchema
    - rawExecutionArtifactSchema
    properties:
      revision:
        const: 1
      legacyResultIndexPurpose:
        const: TASK_PROGRESS_ONLY_NOT_PROFILE_ACCEPTANCE
      localOwner:
        const: POC_TASK
      productionOwner:
        const: GZ-020
      localIndexPattern:
        const: evidence/{pocTaskId}/profiles/local-v1/v1/index.yaml
      productionIndexPattern:
        const: evidence/GZ-020/poc/{pocTaskId}/production/v1/index.yaml
      indexSchema:
        const: program.schema.yaml#/$defs/profileEvidenceIndex
      productionExecutionSchema:
        const: program.schema.yaml#/$defs/productionExecution
      productionResultSchema:
        const: program.schema.yaml#/$defs/productionResult
      productionSampleApprovalSchema:
        const: program.schema.yaml#/$defs/productionSampleApproval
      productionComplianceSchema:
        const: program.schema.yaml#/$defs/productionComplianceReview
      resourceConfigurationSchema:
        const: program.schema.yaml#/$defs/resourceConfiguration
      resourceBookingSchema:
        const: program.schema.yaml#/$defs/resourceBooking
      executionWindowSchema:
        const: program.schema.yaml#/$defs/executionWindow
      measurementDomainReviewSchema:
        const: program.schema.yaml#/$defs/measurementDomainReview
      testedSourceSchema:
        const: program.schema.yaml#/$defs/testedSource
      rawExecutionArtifactSchema:
        const: program.schema.yaml#/$defs/rawExecutionArtifact
$defs:
  profileEvidenceIndex:
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - pocId
    - pocTaskId
    - ownerTask
    - acceptanceProfile
    - resultRef
    properties:
      schemaVersion:
        const: 2
      pocId:
        type: string
        pattern: ^POC-[0-9]{2}$
      pocTaskId:
        type: string
        pattern: ^POC-[0-9]{3}$
      ownerTask:
        type: string
        pattern: ^(POC-[0-9]{3}|GZ-020)$
      acceptanceProfile:
        type: object
        additionalProperties: false
        required:
        - id
        - version
        - bindingRevision
        - scope
        properties:
          id:
            enum:
            - local-v1
            - production
          version:
            type: integer
            const: 1
          bindingRevision:
            type: integer
            const: 1
          scope:
            enum:
            - LOCAL_FULL_V1
            - PRODUCTION_RELEASE
      resultRef:
        type: string
        minLength: 1
  productionExecution:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - pocId
    - taskId
    - evidencePath
    - executor
    - resources
    - environmentCaptured
    - commands
    - rawOutputRefs
    - samples
    - measurements
    - provenance
    - complianceReviews
    - notes
    properties:
      schemaVersion:
        type: integer
        const: 2
      pocId:
        type: string
        pattern: ^POC-[0-9]{2}$
      taskId:
        const: GZ-020
      evidencePath:
        const: evidence/GZ-020
      executor:
        type: string
        minLength: 1
      resources:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - configurationRef
          - bookingRef
          properties:
            id:
              type: string
              pattern: ^RES-[A-Z0-9-]+$
            configurationRef:
              type: string
              minLength: 1
            bookingRef:
              type:
              - string
              - 'null'
      environmentCaptured:
        type: object
        minProperties: 1
        additionalProperties: true
      commands:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - command
          - expectedExitCodes
          - exitCode
          - outputRef
          properties:
            command:
              type: string
              minLength: 1
            expectedExitCodes:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: integer
            exitCode:
              type: integer
            outputRef:
              type: string
              minLength: 1
      rawOutputRefs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      samples:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - immutableId
          - checksum
          - approved
          - approvalRef
          properties:
            id:
              type: string
              pattern: ^SAMPLE-[A-Z0-9-]+$
            immutableId:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:@/-]{7,127}$
            checksum:
              type: string
              pattern: ^sha256:[0-9a-fA-F]{64}$
            approved:
              const: true
            approvalRef:
              type: string
              minLength: 1
      measurements:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - actual
          properties:
            id:
              type: string
              pattern: ^[a-z0-9_]+$
            actual:
              oneOf:
              - type: number
              - type: boolean
      provenance:
        type: object
        additionalProperties: false
        properties:
          input_sha256:
            type: string
            pattern: ^sha256:[0-9a-fA-F]{64}$
          output_sha256:
            type: string
            pattern: ^sha256:[0-9a-fA-F]{64}$
          encoder_parameters:
            oneOf:
            - type: string
              minLength: 1
            - type: object
              minProperties: 1
      complianceReviews:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required:
          - type
          - subjectVersion
          - reviewRef
          properties:
            type:
              enum:
              - privacy
              - license
            subjectVersion:
              type: string
              minLength: 1
            reviewRef:
              type: string
              minLength: 1
      notes:
        type:
        - string
        - 'null'
  productionResult:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - pocId
    - taskId
    - status
    - evidencePath
    - executionRef
    - decision
    - rationale
    - reviewer
    - approvedAt
    - approval
    properties:
      schemaVersion:
        type: integer
        const: 2
      pocId:
        type: string
        pattern: ^POC-[0-9]{2}$
      taskId:
        const: GZ-020
      status:
        enum:
        - pass
        - fail
        - inconclusive
      evidencePath:
        const: evidence/GZ-020
      executionRef:
        type: string
        minLength: 1
      decision:
        enum:
        - pass
        - fail
        - inconclusive
      rationale:
        type: string
        minLength: 1
      reviewer:
        type: string
        minLength: 1
      approvedAt:
        type: string
        pattern: ^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      approval:
        const: approved
  productionSampleApproval:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - pocId
    - taskId
    - sampleId
    - immutableId
    - checksum
    - decision
    - approver
    - approvedAt
    properties:
      schemaVersion:
        type: integer
        const: 2
      pocId:
        type: string
        pattern: ^POC-[0-9]{2}$
      taskId:
        const: GZ-020
      sampleId:
        type: string
        pattern: ^SAMPLE-[A-Z0-9-]+$
      immutableId:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:@/-]{7,127}$
      checksum:
        type: string
        pattern: ^sha256:[0-9a-fA-F]{64}$
      decision:
        const: approved
      approver:
        type: string
        minLength: 1
      approvedAt:
        type: string
        format: date-time
  productionComplianceReview:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - pocId
    - taskId
    - type
    - subjectVersion
    - decision
    - reviewer
    - approvedAt
    - scope
    properties:
      schemaVersion:
        type: integer
        const: 2
      pocId:
        type: string
        pattern: ^POC-[0-9]{2}$
      taskId:
        const: GZ-020
      type:
        enum:
        - privacy
        - license
      subjectVersion:
        type: string
        minLength: 1
      decision:
        const: approved
      reviewer:
        type: string
        minLength: 1
      approvedAt:
        type: string
        format: date-time
      scope:
        type: string
        minLength: 1
  resourceConfiguration:
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - pocId
    - taskId
    - acceptanceProfile
    - kind
    - resourceId
    - status
    - approvedBy
    - approvedAt
    - validFrom
    - validUntil
    - configuration
    properties:
      schemaVersion:
        type: integer
        const: 2
      pocId:
        type: string
        pattern: ^POC-[0-9]{2}$
      taskId:
        type: string
        pattern: ^(POC-[0-9]{3}|GZ-020)$
      acceptanceProfile:
        type: object
        additionalProperties: false
        required:
        - id
        - version
        - bindingRevision
        - scope
        properties:
          id:
            enum:
            - local-v1
            - production
          version:
            type: integer
            const: 1
          bindingRevision:
            type: integer
            const: 1
          scope:
            enum:
            - LOCAL_FULL_V1
            - PRODUCTION_RELEASE
      kind:
        const: resource_configuration
      resourceId: &id002
        type: string
        minLength: 1
      status:
        enum:
        - approved
        - rejected
        - cancelled
        - expired
      approvedBy:
        type: string
        minLength: 1
      approvedAt:
        type: string
        format: date-time
      validFrom: &id001
        type: string
        format: date-time
      validUntil: *id001
      configuration:
        type: object
        minProperties: 1
  resourceBooking:
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - pocId
    - taskId
    - acceptanceProfile
    - kind
    - resourceId
    - status
    - approvedBy
    - approvedAt
    - validFrom
    - validUntil
    properties:
      schemaVersion:
        type: integer
        const: 2
      pocId:
        type: string
        pattern: ^POC-[0-9]{2}$
      taskId:
        type: string
        pattern: ^(POC-[0-9]{3}|GZ-020)$
      acceptanceProfile:
        type: object
        additionalProperties: false
        required:
        - id
        - version
        - bindingRevision
        - scope
        properties:
          id:
            enum:
            - local-v1
            - production
          version:
            type: integer
            const: 1
          bindingRevision:
            type: integer
            const: 1
          scope:
            enum:
            - LOCAL_FULL_V1
            - PRODUCTION_RELEASE
      kind:
        const: resource_booking
      resourceId: *id002
      status:
        enum:
        - approved
        - rejected
        - cancelled
        - expired
      approvedBy:
        type: string
        minLength: 1
      approvedAt:
        type: string
        format: date-time
      validFrom: &id003
        type: string
        format: date-time
      validUntil: *id003
  executionWindow:
    type: object
    additionalProperties: false
    required:
    - startedAt
    - finishedAt
    properties:
      startedAt: &id004
        type: string
        format: date-time
      finishedAt: *id004
  measurementDomainReview:
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - pocId
    - taskId
    - acceptanceProfile
    - kind
    - measurementId
    - unit
    - environmentCaptured
    - domain
    - definitionRef
    - decision
    - reviewer
    - approvedAt
    properties:
      schemaVersion:
        type: integer
        const: 2
      pocId:
        type: string
        pattern: ^POC-[0-9]{2}$
      taskId:
        type: string
        pattern: ^(POC-[0-9]{3}|GZ-020)$
      acceptanceProfile:
        type: object
        additionalProperties: false
        required:
        - id
        - version
        - bindingRevision
        - scope
        properties:
          id:
            enum:
            - local-v1
            - production
          version:
            type: integer
            const: 1
          bindingRevision:
            type: integer
            const: 1
          scope:
            enum:
            - LOCAL_FULL_V1
            - PRODUCTION_RELEASE
      kind:
        const: measurement_domain_review
      measurementId: *id002
      unit: *id002
      environmentCaptured:
        type: object
        minProperties: 1
      domain:
        type: object
        additionalProperties: false
        required:
        - mode
        - minimum
        - maximum
        - integral
        properties:
          mode:
            enum:
            - finite
            - bounded
          minimum:
            type:
            - number
            - 'null'
          maximum:
            type:
            - number
            - 'null'
          integral:
            type: boolean
      definitionRef: *id002
      decision:
        const: approved
      reviewer: *id002
      approvedAt: *id004
  testedSource:
    type: object
    additionalProperties: false
    required:
    - commit
    - tree
    properties:
      commit:
        type: string
        pattern: ^[0-9a-f]{40}$
      tree:
        type: string
        pattern: ^[0-9a-f]{40}$
  rawExecutionArtifact:
    type: object
    additionalProperties: false
    required: [ref, artifactType, byteCount, sha256]
    properties:
      ref:
        type: string
        minLength: 1
      artifactType:
        enum: [command_output, measurement_output, scope_observation, produced_media]
      nodeId:
        type: string
        minLength: 1
      byteCount:
        type: integer
        minimum: 0
      sha256:
        type: string
        pattern: '^sha256:[0-9a-f]{64}$'
  inputSampleArtifact:
    type: object
    additionalProperties: false
    required:
    - sampleId
    - immutableId
    - inputArtifactRef
    - byteCount
    - sha256
    properties:
      sampleId:
        type: string
        pattern: ^SAMPLE-[A-Z0-9-]+$
      immutableId:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:@/-]{7,127}$
      inputArtifactRef:
        type: string
        minLength: 1
      byteCount:
        type: integer
        minimum: 1
      sha256:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
  localHierarchyCapture:
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - scope
    - generator
    properties:
      schemaVersion:
        type: integer
        const: 1
      scope:
        const: LOCAL_FULL_V1
      generator:
        type: object
        additionalProperties: false
        required:
        - algorithm
        - seed
        - rootPath
        - fileCount
        - directoryCount
        - maximumDepth
        properties:
          algorithm:
            const: deterministic-tree-v1
          seed:
            type: integer
            minimum: 0
          rootPath:
            type: string
            minLength: 1
          fileCount:
            type: integer
            minimum: 1
          directoryCount:
            type: integer
            minimum: 1
          maximumDepth:
            type: integer
            minimum: 1
  localFailureCapture:
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - scope
    - cases
    properties:
      schemaVersion:
        type: integer
        const: 1
      scope:
        const: LOCAL_FULL_V1
      cases:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - caseId
          - fault
          - parameters
          - observation
          - rawOutputRef
          properties:
            caseId:
              type: string
              minLength: 1
            fault:
              enum:
              - http_429
              - http_5xx
              - network_disconnect
              - auth_expired
            parameters:
              type: object
              minProperties: 1
            observation:
              const: exercised
            rawOutputRef:
              type: string
              minLength: 1
  localTlsCapture:
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - scope
    - entryOrigin
    - openlistOrigin
    - reverseProxy
    - certificateIdentity
    - sandboxId
    properties:
      schemaVersion:
        type: integer
        const: 1
      scope:
        const: LOCAL_FULL_V1
      entryOrigin:
        type: string
        pattern: ^https://(?:[A-Za-z0-9.-]+|\[[0-9a-fA-F:]+\])(?::[0-9]{1,5})?$
      openlistOrigin:
        type: string
        pattern: ^https?://(?:[A-Za-z0-9.-]+|\[[0-9a-fA-F:]+\])(?::[0-9]{1,5})?$
      reverseProxy:
        type: string
        minLength: 1
      certificateIdentity:
        type: string
        pattern: ^sha256:[0-9a-f]{64}$
      sandboxId:
        type: string
        minLength: 1
  localSegmentCapture:
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - scope
    - codec
    - container
    - segmentDurationSeconds
    - keyframeAligned
    properties:
      schemaVersion:
        type: integer
        const: 1
      scope:
        const: LOCAL_FULL_V1
      codec:
        const: av1
      container:
        enum:
        - fmp4
        - cmaf
      segmentDurationSeconds:
        type: number
        exclusiveMinimum: 0
      keyframeAligned:
        const: true
  localSchedulerCapture:
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - scope
    - priorities
    - maxConcurrentSegments
    - perNodeConcurrency
    properties:
      schemaVersion:
        type: integer
        const: 1
      scope:
        const: LOCAL_FULL_V1
      priorities:
        type: object
        required:
        - playback
        - prewarm
        - background
        properties:
          playback:
            type: integer
            const: 0
          prewarm:
            type: integer
            const: 3
          background:
            type: integer
            const: 6
        additionalProperties:
          type: integer
          minimum: 0
          maximum: 6
      maxConcurrentSegments:
        type: integer
        minimum: 1
      perNodeConcurrency:
        type: integer
        minimum: 1
  profileConfiguration:
    type: object
    additionalProperties: false
    required:
    - schemaVersion
    - pocId
    - taskId
    - acceptanceProfile
    - resourceIds
    - measurementIds
    - testedSource
    - numericDomainReviewRefs
    - decision
    - approvedBy
    - approvedAt
    - capturedSettings
    properties:
      schemaVersion:
        type: integer
        const: 2
      pocId:
        type: string
        pattern: ^POC-[0-9]{2}$
      taskId:
        type: string
        pattern: ^(POC-[0-9]{3}|GZ-020)$
      acceptanceProfile:
        type: object
        additionalProperties: false
        required:
        - id
        - version
        - bindingRevision
        - scope
        properties:
          id:
            enum:
            - local-v1
            - production
          version:
            type: integer
            const: 1
          bindingRevision:
            type: integer
            const: 1
          scope:
            enum:
            - LOCAL_FULL_V1
            - PRODUCTION_RELEASE
      resourceIds:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      measurementIds:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      testedSource:
        type: object
        additionalProperties: false
        required:
        - commit
        - tree
        properties:
          commit:
            type: string
            pattern: ^[0-9a-f]{40}$
          tree:
            type: string
            pattern: ^[0-9a-f]{40}$
      numericDomainReviewRefs:
        type: object
        additionalProperties:
          type: string
          minLength: 1
      decision:
        const: approved
      approvedBy:
        type: string
        minLength: 1
      approvedAt:
        type: string
        format: date-time
      capturedSettings:
        type: object
        additionalProperties: false
        required: []
        properties:
