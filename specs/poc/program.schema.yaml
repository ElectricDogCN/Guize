          - requests
          - copyRejections
          - disconnect
          - backupRestore
          - evictionAfterStateRef
          - evictedAt
          - migration
          - concurrentWorkloadRef
          properties:
            sampleId:
              type: string
              minLength: 1
            concurrentWorkloadRef: {type: string, minLength: 1}
            requests:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - case
                - requestId
                - objectURL
                - assetId
                - versionId
                - authRef
                - requestRange
                - statusCode
                - contentRange
                - responseRef
                - responseSha256
                - originByteCount
                - originAccessRef
                - startedAt
                - finishedAt
                properties:
                  case:
                    enum:
                    - full
                    - bounded
                    - suffix
                    - unsatisfiable
                    - missing_auth
                    - invalid_auth
                    - concurrent_a
                    - concurrent_b
                  requestId:
                    type: string
                    minLength: 1
                  objectURL:
                    type: string
                    minLength: 1
                  assetId:
                    type: string
                    minLength: 1
                  versionId:
                    type: string
                    minLength: 1
                  authRef:
                    type:
                    - string
                    - 'null'
                    pattern: ^secretref_[A-Za-z0-9_-]{1,64}$
                    maxLength: 74
                  requestRange:
                    type:
                    - string
                    - 'null'
                  statusCode:
                    type: integer
                  contentRange:
                    type:
                    - string
                    - 'null'
                  responseRef:
                    type: string
                    minLength: 1
                  responseSha256:
                    type: string
                    pattern: ^sha256:[0-9a-f]{64}$
                  originAccessRef: {type: string, minLength: 1}
                  originByteCount:
                    type: integer
                    minimum: 0
                  startedAt:
                    type: string
                    format: date-time
                  finishedAt:
                    type: string
                    format: date-time
            copyRejections:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - case
                - assetId
                - versionId
                - payloadRef
                - sha256
                - expectedSha256
                - promotionDecision
                - afterStateRef
                - startedAt
                - finishedAt
                properties:
                  case:
                    enum:
                    - incomplete
                    - hash_mismatch
                  assetId:
                    type: string
                    minLength: 1
                  versionId:
                    type: string
                    minLength: 1
                  payloadRef:
                    type: string
                    minLength: 1
                  sha256:
                    type: string
                    pattern: ^sha256:[0-9a-f]{64}$
                  expectedSha256:
                    type: string
                    pattern: ^sha256:[0-9a-f]{64}$
                  promotionDecision:
                    enum:
                    - rejected
                    - verified
                  afterStateRef:
                    type: string
                    minLength: 1
                  startedAt:
                    type: string
                    format: date-time
                  finishedAt:
                    type: string
                    format: date-time
            disconnect:
              type: object
              additionalProperties: false
              required:
              - attempts
              - serviceRestartedAt
              - afterStateRef
              properties:
                attempts:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - attemptNo
                    - startedAt
                    - finishedAt
                    - transport
                    - responseRef
                    - responseSha256
                    - partialPromotedCount
                    properties:
                      attemptNo:
                        type: integer
                        minimum: 1
                      startedAt:
                        type: string
                        format: date-time
                      finishedAt:
                        type: string
                        format: date-time
                      transport:
                        enum:
                        - disconnected
                        - success
                      responseRef:
                        type: string
                        minLength: 1
                      responseSha256:
                        type: string
                        pattern: ^sha256:[0-9a-f]{64}$
                      partialPromotedCount:
                        type: integer
                        minimum: 0
                serviceRestartedAt:
                  type: string
                  format: date-time
                afterStateRef:
                  type: string
                  minLength: 1
            backupRestore:
              type: object
              additionalProperties: false
              required:
              - backupDataRef
              - backupSha256
              - restoredDataRef
              - restoredSha256
              - backupStateRef
              - restoredStateRef
              - startedAt
              - finishedAt
              properties:
                backupDataRef:
                  type: string
                  minLength: 1
                backupSha256:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
                restoredDataRef:
                  type: string
                  minLength: 1
                restoredSha256:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
                backupStateRef:
                  type: string
                  minLength: 1
                restoredStateRef:
                  type: string
                  minLength: 1
                startedAt:
                  type: string
                  format: date-time
                finishedAt:
                  type: string
                  format: date-time
            evictionAfterStateRef:
              type: string
              minLength: 1
            evictedAt:
              type: string
              format: date-time
            migration:
              type: object
              additionalProperties: false
              required:
              - newReplicaId
              - copyingStateRef
              - verifiedStateRef
              - startedAt
              - verifiedAt
              properties:
                newReplicaId:
                  type: string
                  minLength: 1
                copyingStateRef:
                  type: string
                  minLength: 1
                verifiedStateRef:
                  type: string
                  minLength: 1
                startedAt:
                  type: string
                  format: date-time
                verifiedAt:
                  type: string
                  format: date-time
      capacityObservations:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
          - phase
          - observedAt
          - freeBytes
          - reservedBytes
          - admission
          - telemetryRef
          properties:
            phase:
              enum:
              - baseline
              - fill
              - pause
              - evict
              - resume
            observedAt:
              type: string
              format: date-time
            freeBytes:
              type: integer
              minimum: 0
            reservedBytes:
              type: integer
              minimum: 0
            admission:
              enum:
              - paused
              - admitted
            telemetryRef:
              type: string
              minLength: 1
