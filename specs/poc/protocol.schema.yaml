$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
- commands
- rawOutputRefs
- measurements
- exitCriteria
- failureFallbacks
- rollbackCleanup
properties:
  commands:
    type: array
    items:
      type: string
  rawOutputRefs:
    type: array
    items:
      type: string
  measurements:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - metric
      - unit
      - method
      - thresholdSource
      - actual
      properties:
        id:
          type: string
          pattern: ^[a-z0-9_]+$
        metric:
          type: string
          minLength: 1
        unit:
          type: string
          minLength: 1
        method:
          type: string
          minLength: 1
        thresholdSource:
          type: string
          minLength: 1
        actual:
          type:
          - number
          - string
          - boolean
          - 'null'
  exitCriteria:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  failureFallbacks:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  rollbackCleanup:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
