$schema: https://json-schema.org/draft/2020-12/schema
$id: traceability.schema.yaml
title: Guize V1 Requirement Traceability
type: object
additionalProperties: false
required:
- $schema
- schemaVersion
- contractId
- status
- authority
- supplementPolicy
- producedContracts
- requirements
- acceptanceProfileBinding
properties:
  $schema:
    const: traceability.schema.yaml
  schemaVersion:
    const: 2
  contractId:
    const: ACCEPTANCE-TRACE-V1
  status:
    const: frozen
  authority:
    type: object
    additionalProperties: false
    required:
    - requirements
    - acceptance
    - programPlan
    - moduleOwnership
    properties:
      requirements:
        const: specs/requirements/v1/requirements.yaml
      acceptance:
        const: specs/acceptance/requirements/acceptance.yaml
      programPlan:
        const: specs/coordination/program-plan.yaml
      moduleOwnership:
        const: specs/designs/module-ownership.yaml
  supplementPolicy:
    type: string
    minLength: 40
  producedContracts:
    const:
    - REQ-V1
    - NFR-V1
    - ACCEPTANCE-TRACE-V1
  requirements:
    type: array
    minItems: 10
    maxItems: 10
    items:
      $ref: '#/$defs/trace'
  acceptanceProfileBinding:
    type: object
    additionalProperties: false
    required:
    - revision
    - authorityTask
    - decisionRef
    - profiles
    properties:
      revision:
        const: 1
      authorityTask:
        const: GZ-021
      decisionRef:
        const: adr/0015-heterogeneous-av1-workers-and-local-storage-validation.md
      profiles:
        type: array
        minItems: 2
        maxItems: 2
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - version
          - scope
          - milestoneTask
          - canSatisfyProductionGate
          - requirementIds
          - acceptanceIds
          properties:
            id:
              enum:
              - local-v1
              - production
            version:
              const: 1
            scope:
              enum:
              - LOCAL_FULL_V1
              - PRODUCTION_RELEASE
            milestoneTask:
              enum:
              - GZ-018
              - GZ-020
            canSatisfyProductionGate:
              type: boolean
            requirementIds:
              type: array
              minItems: 10
              maxItems: 10
              uniqueItems: true
              items:
                enum:
                - REQ-V1-0001
                - REQ-V1-0002
                - REQ-V1-0003
                - REQ-V1-0004
                - REQ-V1-0005
                - REQ-V1-0006
                - REQ-V1-0007
                - REQ-V1-0008
                - REQ-V1-0009
                - REQ-V1-0010
            acceptanceIds:
              type: array
              minItems: 12
              maxItems: 12
              uniqueItems: true
              items:
                type: string
                minLength: 1
          allOf:
          - if:
              properties:
                id:
                  const: local-v1
            then:
              properties:
                scope:
                  const: LOCAL_FULL_V1
                milestoneTask:
                  const: GZ-018
                canSatisfyProductionGate:
                  const: false
          - if:
              properties:
                id:
                  const: production
            then:
              properties:
                scope:
                  const: PRODUCTION_RELEASE
                milestoneTask:
                  const: GZ-020
                canSatisfyProductionGate:
                  const: true
$defs:
  trace:
    type: object
    additionalProperties: false
    required:
    - requirementId
    - moduleIds
    - workPackages
    - acceptanceIds
    - programAcceptanceIds
    - pocIds
    - programPocIds
    - otherBlockers
    - downstreamTasks
    - programTaskMappingConflicts
    - producedContracts
    properties:
      requirementId:
        type: string
        pattern: ^REQ-V1-[0-9]{4}$
      moduleIds:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: ^MOD-[A-Z0-9-]+$
      workPackages:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      acceptanceIds:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      programAcceptanceIds:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      pocIds:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^POC-[0-9]{2}$
      programPocIds:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^POC-[0-9]{2}$
      otherBlockers:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      downstreamTasks:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: ^(GZ|POC)-[0-9]{3}$
      programTaskMappingConflicts:
        type: array
        uniqueItems: true
        items:
          type: string
          pattern: ^(GZ|POC)-[0-9]{3}$
      producedContracts:
        const:
        - REQ-V1
        - NFR-V1
        - ACCEPTANCE-TRACE-V1
