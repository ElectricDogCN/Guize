  title: 按需访问与播放
  status: frozen
  statement: 通过 Range 回源、ATS 缓存、完整缓存与受限兼容转码提供按需在线播放、预览及 AV1/ABR 能力。
  scope:
  - Range/If-Range/ETag 访问
  - ATS Slice/缓存隔离
  - AV1、源格式、临时 H.264、HLS/DASH ABR 和播放器能力
