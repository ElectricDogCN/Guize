  - 需求V1-0004
  title: 智能理解
  status: frozen
  statement: 对音视频、图片和文档执行可追溯的 ASR、OCR、多模态修正、翻译、摘要、标签、Embedding 与缩略图加工，派生产物继承资产权限并保留置信度/生成来源标记。
  scope:
  - ASR/时间轴/说话人分离/OCR/VLM/翻译/摘要/标签
  - 文本与图像/多模态 Embedding
  - 真实关键帧和生成式缩略图；生成式产物必须具备机器可读 generated 标记并在展示层可见区分
  - 所有 AI 派生产物继承源 Asset ACL；低置信度结果保留 confidence/uncertainty 标记
  nonGoals:
  - AI 输出不直接视为权威事实
  - 不依赖单一商业 AI 或单一模型供应方
  - 生成式缩略图不得冒充真实媒体关键帧
