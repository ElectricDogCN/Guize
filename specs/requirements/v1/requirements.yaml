- id: REQ-V1-0002
  aliases:
  - G-02
  - 需求V1-0002
  title: 统一资产
  status: frozen
  statement: 把同一内容在不同来源、路径、文件名、编码和清晰度下的实体归并为可治理的逻辑资产，并保留来源、版本、Rendition 与 Replica 关系以及来源级独立策略。
  scope:
  - Asset、SourceObject、AssetVersion、Rendition、Replica 统一模型
  - 移动、改名、版本、重复、合并与拆分的可追溯处理
  - 相同内容仍保留不同 SourceObject 的 ACL、标签、路径、Retention 等来源级策略
  nonGoals:
  - 不因建立目录而强制复制全部远程内容
  - 不允许插件直接操作核心数据库
  - 哈希相等不允许覆盖来源级独立策略
