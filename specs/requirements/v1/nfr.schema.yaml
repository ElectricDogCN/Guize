$schema: https://json-schema.org/draft/2020-12/schema
$id: nfr.schema.yaml
title: Guize V1 NFR Baseline
type: object
additionalProperties: false
required:
- $schema
- schemaVersion
- contractId
- status
- authority
- requiredCategories
- items
properties:
  $schema:
    const: nfr.schema.yaml
  schemaVersion:
    const: 1
  contractId:
    const: NFR-V1
  status:
    const: frozen
  authority:
    type: object
    additionalProperties: false
    required:
    - product
    - conflictPolicy
    properties:
      product:
        const: specs/requirements/product-requirements.md
      conflictPolicy:
        type: string
        minLength: 20
  requiredCategories:
    type: array
    minItems: 10
    uniqueItems: true
    items:
      enum:
      - security
      - privacy
      - performance
      - capacity
      - availability
      - recovery
      - observability
      - compatibility
      - maintainability
      - supply-chain
  items:
    type: array
    minItems: 10
    items:
      $ref: '#/$defs/item'
$defs:
  item:
    type: object
    additionalProperties: false
    required:
    - id
    - category
    - title
    - statement
    - sourceRefs
    - measurement
    properties:
      id:
        type: string
        pattern: ^NFR-V1-[A-Z]+-[0-9]{3}$
      category:
        enum:
        - security
        - privacy
        - performance
        - capacity
        - availability
        - recovery
        - observability
        - compatibility
        - maintainability
        - supply-chain
      title:
        type: string
        minLength: 1
      statement:
        type: string
        minLength: 10
      sourceRefs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      measurement:
        type: object
        additionalProperties: false
        required:
        - state
        - value
        - unit
        - verificationOwners
        properties:
          state:
            enum:
            - FROZEN_CONSTRAINT
            - DESIGN_TARGET
            - MEASUREMENT_REQUIRED
          value:
            type:
            - number
            - string
            - 'null'
          unit:
            type:
            - string
            - 'null'
          verificationOwners:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              pattern: ^(GZ|POC)-[0-9]{2,3}$
