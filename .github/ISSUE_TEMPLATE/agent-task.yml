name: Agent Task
description: Agent-driven implementation, review, POC, or governance task
title: "[TASK] "
labels: ["agent-task"]
body:
  - type: markdown
    attributes:
      value: |
        GZ-003 之后的新实现任务必须使用 schemaVersion 2 Task Spec，并在开始实现前通过 reservation PR 登记到 `specs/coordination/active-work.yaml`。
  - type: input
    id: task_id
    attributes:
      label: 任务编号
      description: 任务唯一标识（如 GZ-004）
      placeholder: GZ-000
    validations:
      required: true
  - type: input
    id: work_package
    attributes:
      label: 工作包
      description: 对应 WBS/Work Package（如 WP-M0-03）
    validations:
      required: true
  - type: dropdown
    id: risk_level
    attributes:
      label: 风险等级
      description: high/critical 同时最多一个，并要求独立 Reviewer
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true
  - type: dropdown
    id: agent_role
    attributes:
      label: 当前 Agent 角色
      options:
        - coordinator
        - implementer
        - reviewer
        - integrator
    validations:
      required: true
  - type: input
    id: task_owner
    attributes:
      label: Task Owner / Coordinator
      description: GitHub 用户名或明确的任务负责人
    validations:
      required: true
  - type: textarea
    id: requirement_source
    attributes:
      label: 需求、契约与 ADR 来源
      description: 按权威顺序列出批准需求、机器契约、ADR 和设计链接
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标与非目标
      description: 说明具体输出，并明确不处理的相邻范围
    validations:
      required: true
  - type: input
    id: base_sha
    attributes:
      label: Base Commit SHA
      description: 创建任务/预留时 `main` 的完整 40 位 SHA
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与集成顺序
      description: 列出 dependsOn、共同机器契约、parallelGroup 和 integrationOrder
    validations:
      required: true
  - type: textarea
    id: exclusive_paths
    attributes:
      label: 独占写路径
      description: 每行一个仓库路径/Glob；不得使用 `**` 预占整个仓库
    validations:
      required: true
  - type: textarea
    id: shared_paths
    attributes:
      label: 共享写路径
      description: 无则写“无”；存在时必须说明 coordinationGroup 和 integrationOrder
    validations:
      required: true
  - type: textarea
    id: allowed_scope
    attributes:
      label: 允许范围
      description: 明确允许修改的路径和行为
    validations:
      required: true
  - type: textarea
    id: forbidden_scope
    attributes:
      label: 禁止范围
      description: 明确禁止触碰的路径和行为
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 验收标准
      description: 使用 Given/When/Then 或等价可执行条件，覆盖失败路径
    validations:
      required: true
  - type: textarea
    id: test_method
    attributes:
      label: 必须执行的测试
      description: 包括 Task、Coordination、Readiness、专项测试和 make verify
    validations:
      required: true
  - type: input
    id: lease_expiration
    attributes:
      label: 任务租约到期时间
      description: ISO-8601 UTC；最长不超过 registry policy
      placeholder: 2026-09-01T00:00:00Z
    validations:
      required: true
  - type: input
    id: handoff_path
    attributes:
      label: Handoff 路径
      description: 必须位于 evidence/<task-id>/ 中
      placeholder: evidence/GZ-000/handoff.md
    validations:
      required: true
  - type: dropdown
    id: integration_strategy
    attributes:
      label: 集成方式
      options:
        - merge
        - squash
        - rebase
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 风险与缓解
      description: 与风险等级一致，说明触发器、负责人和应急方案
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: 回滚与恢复验证
      description: 提供可执行步骤；不得直接推送 main
    validations:
      required: true
  - type: input
    id: evidence_path
    attributes:
      label: Evidence 路径
      placeholder: evidence/GZ-000/
    validations:
      required: true
