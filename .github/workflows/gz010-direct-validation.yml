name: GZ-010 Direct Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "specs/poc/**"
      - "poc/**"
      - ".github/workflows/gz010-direct-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gz010-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned governance dependencies
        run: python -m pip install -r requirements-governance.txt

      - name: Execute POC validator and regression suite
        shell: bash
        run: |
          set +e
          python specs/poc/check_program.py
          CHECK_EXIT=$?
          python specs/poc/test_program.py
          TEST_EXIT=$?
          echo "check_program_exit=$CHECK_EXIT"
          echo "test_program_exit=$TEST_EXIT"
          if [ "$CHECK_EXIT" -ne 0 ] || [ "$TEST_EXIT" -ne 0 ]; then
            exit 1
          fi
