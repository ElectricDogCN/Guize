name: GZ-010 One-shot Plan Completeness Repair

on:
  push:
    branches:
      - chore/GZ-010-poc-program-baseline
    paths:
      - ".github/workflows/gz010-plan-completeness-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/GZ-010-poc-program-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned governance dependencies
        run: python -m pip install -r requirements-governance.txt

      - name: Apply, commit and validate the bounded plan repair
        shell: bash
        run: |
          set -euo pipefail
          python specs/poc/_gz010_plan_repair.py
          rm specs/poc/_gz010_plan_repair.py

          git diff --check
          git config user.name "guize-governance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A specs/poc
          git commit -m "fix(GZ-010): complete frozen POC planning gates"

          python -m py_compile specs/poc/check_program.py specs/poc/test_program.py
          python specs/poc/check_program.py
          python specs/poc/test_program.py
          make verify TASK=GZ-010 BASE=origin/main HEAD_REF=HEAD BRANCH=chore/GZ-010-poc-program-baseline

          git push origin HEAD:chore/GZ-010-poc-program-baseline
