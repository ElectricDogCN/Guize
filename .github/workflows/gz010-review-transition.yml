name: GZ-010 Review Transition

on:
  push:
    branches: [chore/GZ-010-poc-program-baseline]
    paths: [".github/workflows/gz010-review-transition.yml"]

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/GZ-010-poc-program-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Apply and verify metadata-only review transition
        shell: bash
        run: |
          set -euo pipefail
          BASE="2b2d076b68171edd74639e307f8a126cc882186d"

          python - <<'PY'
          from pathlib import Path

          BASE = "2b2d076b68171edd74639e307f8a126cc882186d"

          def mutate_block(path, marker, marker_indent, fields):
              file = Path(path)
              lines = file.read_text(encoding="utf-8").splitlines(keepends=True)
              starts = [
                  i for i, line in enumerate(lines)
                  if line.strip() == marker
                  and len(line) - len(line.lstrip()) == marker_indent
              ]
              if len(starts) != 1:
                  raise SystemExit(f"{path}: expected one {marker!r}, found {len(starts)}")
              start = starts[0]
              end = len(lines)
              for i in range(start + 1, len(lines)):
                  indent = len(lines[i]) - len(lines[i].lstrip())
                  stripped = lines[i].strip()
                  if marker_indent == 4 and indent == 4 and stripped.startswith("taskId: "):
                      end = i
                      break
                  if marker_indent == 2 and indent == 2 and stripped.startswith("- taskId: "):
                      end = i
                      break
              for field, before, after in fields:
                  target = f"{field}: {before}"
                  matches = [i for i in range(start, end) if lines[i].strip() == target]
                  if len(matches) != 1:
                      raise SystemExit(f"{path}: expected one {target!r}, found {len(matches)}")
                  i = matches[0]
                  prefix = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
                  lines[i] = f"{prefix}{field}: {after}\n"
              file.write_text("".join(lines), encoding="utf-8")

          mutate_block(
              "specs/coordination/program-plan.yaml",
              "taskId: GZ-010",
              4,
              [("status", "in_progress", "review")],
          )
          mutate_block(
              "specs/coordination/active-work.yaml",
              "- taskId: GZ-010",
              2,
              [
                  ("status", "in_progress", "review"),
                  ("agentRole", "implementer", "reviewer"),
                  ("baseSha", "74ab9d53f29834fda37dcbd726fd58f997f8f21a", BASE),
              ],
          )

          task = Path("specs/tasks/GZ-010.md")
          text = task.read_text(encoding="utf-8")
          parts = text.split("---", 2)
          if len(parts) != 3:
              raise SystemExit("GZ-010 Task Spec has invalid front matter")
          front = parts[1]
          for before, after in [
              ("\nstatus: in_progress\n", "\nstatus: review\n"),
              ("\nbaseSha: 74ab9d53f29834fda37dcbd726fd58f997f8f21a\n", f"\nbaseSha: {BASE}\n"),
              ("\nagentRole: implementer\n", "\nagentRole: reviewer\n"),
          ]:
              if front.count(before) != 1:
                  raise SystemExit(f"Task Spec anchor count for {before!r}: {front.count(before)}")
              front = front.replace(before, after, 1)
          task.write_text("---" + front + "---" + parts[2], encoding="utf-8")
          PY

          rm .github/workflows/gz010-review-transition.yml
          git diff --check
          git config user.name "guize-governance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/coordination/program-plan.yaml \
            specs/coordination/active-work.yaml \
            specs/tasks/GZ-010.md \
            .github/workflows/gz010-review-transition.yml
          git commit -m "chore(GZ-010): enter independent review state"

          python -m pip install -r requirements-governance.txt
          python scripts/check-task-file.py --task GZ-010
          python scripts/check-project-readiness.py
          python scripts/check-program-plan-history.py \
            --base-ref "$BASE" --head-ref HEAD \
            --task GZ-010 --branch-name chore/GZ-010-poc-program-baseline
          python scripts/check-program-plan-transitions.py \
            --base-ref "$BASE" --head-ref HEAD \
            --task GZ-010 --branch-name chore/GZ-010-poc-program-baseline
          python scripts/run-program-lifecycle-gate.py \
            --base-ref "$BASE" --head-ref HEAD \
            --task GZ-010 --branch-name chore/GZ-010-poc-program-baseline
          python -m pytest tests/governance/ -q

          git push origin HEAD:chore/GZ-010-poc-program-baseline
