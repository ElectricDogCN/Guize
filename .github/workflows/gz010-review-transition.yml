name: GZ-010 Review Transition

on:
  push:
    branches:
      - chore/GZ-010-poc-program-baseline
    paths:
      - ".github/workflows/gz010-review-transition.yml"

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/GZ-010-poc-program-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Apply metadata-only in_progress to review transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          BASE = "2b2d076b68171edd74639e307f8a126cc882186d"

          def set_program_field(path: str, task_id: str, field: str, before: str, after: str) -> None:
              file = Path(path)
              lines = file.read_text(encoding="utf-8").splitlines(keepends=True)
              matches = [
                  i for i, line in enumerate(lines)
                  if line.strip() == f"taskId: {task_id}"
                  and len(line) - len(line.lstrip()) == 4
              ]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one Program task {task_id}, found {len(matches)}")
              start = matches[0]
              end = len(lines)
              for i in range(start + 1, len(lines)):
                  if (
                      len(lines[i]) - len(lines[i].lstrip()) == 4
                      and lines[i].strip().startswith("taskId: ")
                  ):
                      end = i
                      break
              target = f"{field}: {before}"
              found = [i for i in range(start, end) if lines[i].strip() == target]
              if len(found) != 1:
                  raise SystemExit(f"{path}: expected one {target!r} in {task_id}, found {len(found)}")
              indent = lines[found[0]][: len(lines[found[0]]) - len(lines[found[0]].lstrip())]
              lines[found[0]] = f"{indent}{field}: {after}\n"
              file.write_text("".join(lines), encoding="utf-8")

          def set_registry_field(path: str, task_id: str, field: str, before: str, after: str) -> None:
              file = Path(path)
              lines = file.read_text(encoding="utf-8").splitlines(keepends=True)
              matches = [
                  i for i, line in enumerate(lines)
                  if line.strip() == f"- taskId: {task_id}"
                  and len(line) - len(line.lstrip()) == 2
              ]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one Registry task {task_id}, found {len(matches)}")
              start = matches[0]
              end = len(lines)
              for i in range(start + 1, len(lines)):
                  if (
                      len(lines[i]) - len(lines[i].lstrip()) == 2
                      and lines[i].strip().startswith("- taskId: ")
                  ):
                      end = i
                      break
              target = f"{field}: {before}"
              found = [i for i in range(start, end) if lines[i].strip() == target]
              if len(found) != 1:
                  raise SystemExit(f"{path}: expected one {target!r} in {task_id}, found {len(found)}")
              indent = lines[found[0]][: len(lines[found[0]]) - len(lines[found[0]].lstrip())]
              lines[found[0]] = f"{indent}{field}: {after}\n"
              file.write_text("".join(lines), encoding="utf-8")

          def set_front_matter(path: str, replacements: list[tuple[str, str]]) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              parts = text.split("---", 2)
              if len(parts) != 3:
                  raise SystemExit(f"{path}: invalid front matter")
              front = parts[1]
              for before, after in replacements:
                  if front.count(before) != 1:
                      raise SystemExit(f"{path}: expected one front-matter anchor {before!r}, found {front.count(before)}")
                  front = front.replace(before, after, 1)
              file.write_text("---" + front + "---" + parts[2], encoding="utf-8")

          set_program_field(
              "specs/coordination/program-plan.yaml",
              "GZ-010",
              "status",
              "in_progress",
              "review",
          )
          set_registry_field(
              "specs/coordination/active-work.yaml",
              "GZ-010",
              "status",
              "in_progress",
              "review",
          )
          set_registry_field(
              "specs/coordination/active-work.yaml",
              "GZ-010",
              "agentRole",
              "implementer",
              "reviewer",
          )
          set_registry_field(
              "specs/coordination/active-work.yaml",
              "GZ-010",
              "baseSha",
              "74ab9d53f29834fda37dcbd726fd58f997f8f21a",
              BASE,
          )
          set_front_matter(
              "specs/tasks/GZ-010.md",
              [
                  ("\nstatus: in_progress\n", "\nstatus: review\n"),
                  ("\nbaseSha: 74ab9d53f29834fda37dcbd726fd58f997f8f21a\n", f"\nbaseSha: {BASE}\n"),
                  ("\nagentRole: implementer\n", "\nagentRole: reviewer\n"),
              ],
          )
          PY

          rm .github/workflows/gz010-review-transition.yml
          git diff --check
          git config user.name "guize-governance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/coordination/program-plan.yaml \
            specs/coordination/active-work.yaml \
            specs/tasks/GZ-010.md \
            .github/workflows/gz010-review-transition.yml
          git commit -m "chore(GZ-010): enter independent review state"

          python -m pip install -r requirements-governance.txt
          python scripts/check-task-file.py --task GZ-010
          python scripts/check-project-readiness.py
          python scripts/check-program-plan-history.py \
            --base-ref "$BASE" --head-ref HEAD \
            --task GZ-010 --branch-name chore/GZ-010-poc-program-baseline
          python scripts/check-program-plan-transitions.py \
            --base-ref "$BASE" --head-ref HEAD \
            --task GZ-010 --branch-name chore/GZ-010-poc-program-baseline
          python scripts/run-program-lifecycle-gate.py \
            --base-ref "$BASE" --head-ref HEAD \
            --task GZ-010 --branch-name chore/GZ-010-poc-program-baseline
          python -m pytest tests/governance/ -q

          git push origin HEAD:chore/GZ-010-poc-program-baseline
