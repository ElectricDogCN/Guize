name: Governance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    paths:
      - 'AGENTS.md'
      - 'rules/**'
      - 'specs/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/governance-gate.yml'
      - 'requirements-governance.txt'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task ID to validate (e.g., GZ-001)'
        required: false
        default: ''

jobs:
  governance-check:
    name: Governance Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install governance dependencies
        id: install-deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-governance.txt
          echo "--- Installed packages ---"
          pip freeze | grep -E 'pytest|PyYAML|jsonschema'

      - name: Verify core dependencies importable
        id: verify-deps
        run: |
          set -euo pipefail
          python -c "import yaml, pytest, jsonschema; print('OK: All dependencies importable')"

      - name: Compile scripts and tests
        id: compile
        run: |
          set -euo pipefail
          echo "--- Compiling scripts and tests ---"
          python -m compileall -q scripts tests
          echo "OK: Compilation successful"

      - name: Pytest collect-only
        id: collect-tests
        run: |
          set -euo pipefail
          echo "--- Collecting tests ---"
          python -m pytest --collect-only -q tests/governance/
          echo "OK: Test collection successful"

      - name: Task file validation
        id: task-file-validation
        run: |
          set -euo pipefail
          TASK_ID="${{ github.event.inputs.task }}"
          if [ -z "$TASK_ID" ]; then
            TASK_ID=$(echo "${{ github.head_ref || github.ref_name }}" | grep -oE '^[a-z]+/([A-Z]+-[0-9]+)' | cut -d/ -f2 || true)
          fi
          if [ -z "$TASK_ID" ]; then
            echo "::warning::No task ID provided or extracted; skipping task file validation."
            exit 0
          fi
          echo "Validating task file for: $TASK_ID"
          python scripts/check-task-file.py --task "$TASK_ID"

      - name: Governance tests
        id: governance-tests
        run: |
          set -euo pipefail
          echo "--- Running governance tests ---"
          mkdir -p /tmp/test-results
          python -m pytest tests/governance/ -v -ra --junitxml=/tmp/test-results/governance-junit.xml

      - name: Skip audit
        id: skip-audit
        if: success() || failure()
        run: |
          set -euo pipefail
          echo "--- Auditing skipped tests ---"
          if [ -f /tmp/test-results/governance-junit.xml ]; then
            python scripts/check-pytest-skips.py /tmp/test-results/governance-junit.xml tests/governance/allowed-skips.txt
          else
            echo "::warning::JUnit XML not found; skipping skip audit."
          fi

      - name: Markdown basic check
        id: markdown-check
        if: success() || failure()
        run: |
          set -euo pipefail
          EXIT_CODE=0

          echo "Checking for trailing spaces in Markdown files..."
          if git grep -n '[[:space:]]$' -- '*.md'; then
            echo "::error::Found trailing spaces in Markdown files."
            EXIT_CODE=1
          else
            echo "OK: No trailing spaces found."
          fi

          echo "Checking for broken internal Markdown links..."
          find . -name '*.md' -print0 | while IFS= read -r -d '' file; do
            grep -oE '\[([^]]+)\]\(([^)]+\.md)(#[^)]*)?\)' "$file" | while read -r match; do
              link=$(echo "$match" | sed -E 's/.*\]\(([^)]+)\).*/\1/' | sed 's/#.*//')
              if [ -n "$link" ] && [ ! -f "$(dirname "$file")/$link" ] && [ ! -f "$link" ]; then
                echo "::warning::Possible broken link in $file: $match"
              fi
            done
          done

          exit $EXIT_CODE

      - name: YAML/JSON schema check
        id: schema-check
        if: success() || failure()
        run: |
          set -euo pipefail
          EXIT_CODE=0

          echo "Validating GitHub workflow YAML files..."
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$file" ] || continue
            echo "Checking $file"
            python -c "import yaml; yaml.safe_load(open('$file'))" || {
              echo "::error::Invalid YAML: $file"
              EXIT_CODE=1
            }
          done

          echo "Validating JSON files under contracts/..."
          for file in contracts/**/*.json; do
            [ -e "$file" ] || continue
            echo "Checking $file"
            python -c "import json; json.load(open('$file'))" || {
              echo "::error::Invalid JSON: $file"
              EXIT_CODE=1
            }
          done

          echo "Validating YAML files under contracts/..."
          for file in contracts/**/*.yaml contracts/**/*.yml; do
            [ -e "$file" ] || continue
            echo "Checking $file"
            python -c "import yaml; yaml.safe_load(open('$file'))" || {
              echo "::error::Invalid YAML: $file"
              EXIT_CODE=1
            }
          done

          exit $EXIT_CODE

      - name: Secret scan
        id: secret-scan
        if: success() || failure()
        run: |
          set -euo pipefail
          EXIT_CODE=0
          echo "Scanning for common secret patterns..."

          HIGH_RISK='(AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|sk-[a-zA-Z0-9]{20,}|AIza[0-9A-Za-z_-]{35})'
          matches=$(git grep -inE "$HIGH_RISK" -- '*.py' '*.yaml' '*.yml' '*.json' '*.md' '*.sh')
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::High-risk secret pattern detected."
            EXIT_CODE=1
          fi

          PATTERNS='(password|secret|token|key|api_key|apikey|private_key)\s*=\s*["'\''`][^"'\''`]{8,}'
          matches=$(git grep -inE "$PATTERNS" -- '*.py' '*.yaml' '*.yml' '*.json' '*.md' '*.sh')
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::warning::Potential secret-like patterns detected. Review manually."
          fi

          exit $EXIT_CODE

      - name: Evidence check
        id: evidence-check
        if: success() || failure()
        run: |
          set -euo pipefail
          TASK_ID="${{ github.event.inputs.task }}"
          if [ -z "$TASK_ID" ]; then
            TASK_ID=$(echo "${{ github.head_ref || github.ref_name }}" | grep -oE '^[a-z]+/([A-Z]+-[0-9]+)' | cut -d/ -f2 || true)
          fi
          if [ -z "$TASK_ID" ]; then
            echo "::warning::No task ID provided or extracted; skipping evidence check."
            exit 0
          fi
          echo "Checking evidence for task: $TASK_ID"
          python scripts/check-evidence.py --task "$TASK_ID"

      - name: Task-branch linkage check
        id: linkage-check
        if: success() || failure()
        run: |
          set -euo pipefail
          if [ -n "${{ github.head_ref }}" ]; then
            python scripts/check-pr-task-link.py --branch "${{ github.head_ref }}"
          else
            echo "Not a pull request; skipping PR task linkage check."
          fi

      - name: Scope check
        id: scope-check
        if: success() || failure()
        run: |
          set -euo pipefail
          TASK_ID="${{ github.event.inputs.task }}"
          if [ -z "$TASK_ID" ]; then
            TASK_ID=$(echo "${{ github.head_ref || github.ref_name }}" | grep -oE '^[a-z]+/([A-Z]+-[0-9]+)' | cut -d/ -f2 || true)
          fi
          if [ -z "$TASK_ID" ]; then
            echo "::warning::No task ID provided or extracted; skipping scope check."
            exit 0
          fi
          echo "Checking scope for task: $TASK_ID"
          python scripts/check-task-scope.py --task "$TASK_ID" --base origin/main

      - name: Parent directory reference check
        id: parent-dir-check
        if: success() || failure()
        run: |
          set -euo pipefail
          echo "Checking for prohibited parent directory references..."
          EXIT_CODE=0

          if grep -rnE '\.\./tests/|/workspace/tests/' Makefile scripts/ tests/; then
            echo "::error::Found prohibited parent directory reference."
            EXIT_CODE=1
          fi

          if grep -rnE '\.\./tests/|/workspace/tests/' .github/workflows/governance-gate.yml | grep -v '^[[:space:]]*#'; then
            echo "::error::CI workflow contains prohibited parent directory reference."
            EXIT_CODE=1
          fi

          if [ $EXIT_CODE -eq 0 ]; then
            echo "OK: No prohibited parent directory references found."
          fi

          exit $EXIT_CODE

      - name: CI workflow static validation
        id: ci-validation
        if: success() || failure()
        run: |
          set -euo pipefail
          echo "Validating CI workflow structure..."
          python tests/governance/test_repository_boundary.py TestCIWorkflowStatic

      - name: Generate governance report
        id: summary
        if: always()
        run: |
          set -euo pipefail
          echo "## Governance Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          for step in checkout setup-python install-deps verify-deps compile collect-tests task-file-validation governance-tests skip-audit markdown-check schema-check secret-scan evidence-check linkage-check scope-check parent-dir-check ci-validation; do
            outcome="${{ steps[$step].outcome }}"
            echo "| ${step//-/_} | $outcome |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Ref: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.head_ref }}" ]; then
            echo "PR Branch: ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
          fi
