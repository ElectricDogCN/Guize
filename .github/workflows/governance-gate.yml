name: Governance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: 'Task ID to validate (e.g., GZ-003)'
        required: false
        default: ''

concurrency:
  group: governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance-controls:
    name: Governance Controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Python 3.11
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install governance dependencies
        id: install-deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-governance.txt pytest-xdist==3.8.0
          echo "--- Installed packages ---"
          pip freeze | grep -E 'pytest|PyYAML|jsonschema'

      - name: Verify core dependencies importable
        id: verify-deps
        run: |
          set -euo pipefail
          python -c "import yaml, pytest, jsonschema; print('OK: All dependencies importable')"

      - name: Compile scripts and tests
        id: compile
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests

      - name: Resolve task context
        id: task-context
        env:
          REQUESTED_TASK: ${{ github.event.inputs.task }}
        run: |
          set -euo pipefail
          TASK_ID="$REQUESTED_TASK"
          REF_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ -n "$TASK_ID" ] && ! [[ "$TASK_ID" =~ ^[A-Z]+-[0-9]+$ ]]; then
            echo '::error::The requested task must be a task ID such as GZ-003.'
            exit 1
          fi
          if [ -z "$TASK_ID" ] && [[ "$REF_NAME" =~ ^(feat|fix|docs|refactor|chore)/([A-Z]+-[0-9]+)-.+$ ]]; then
            TASK_ID="${BASH_REMATCH[2]}"
          fi
          if [ -z "$TASK_ID" ] && [ -n "${GITHUB_HEAD_REF:-}" ]; then
            echo "::error::Pull-request branch '$REF_NAME' does not follow <type>/<TASK-ID>-<short-name>."
            exit 1
          fi
          if [ -n "$TASK_ID" ]; then
            echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
            echo "task_specific=true" >> "$GITHUB_OUTPUT"
            echo "Resolved task: $TASK_ID"
          else
            echo "task_id=" >> "$GITHUB_OUTPUT"
            echo "task_specific=false" >> "$GITHUB_OUTPUT"
            echo "Non-task ref '$REF_NAME'; repository-wide checks will derive affected lifecycle tasks from the full diff."
          fi

      - name: Task file validation
        id: task-file-validation
        if: steps.task-context.outputs.task_specific == 'true'
        run: |
          set -euo pipefail
          python scripts/check-task-file.py --task "${{ steps.task-context.outputs.task_id }}"

      - name: Project readiness check
        id: project-readiness
        if: success() || failure()
        run: |
          set -euo pipefail
          python scripts/check-project-readiness.py

      - name: Program Plan integrity, history, transitions, finalization, and lifecycle guard
        id: program-integrity
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -n "${GITHUB_HEAD_REF:-}" ]; then
            BASE_REF="origin/$GITHUB_BASE_REF"
            HEAD_REF="HEAD"
            BRANCH_NAME="$GITHUB_HEAD_REF"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO_SHA" ] && git rev-parse --verify "$PUSH_BEFORE^{commit}" >/dev/null 2>&1; then
            BASE_REF="$PUSH_BEFORE"
            HEAD_REF="HEAD"
            BRANCH_NAME="$GITHUB_REF_NAME"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE_REF="HEAD^"
            HEAD_REF="HEAD"
            BRANCH_NAME="$GITHUB_REF_NAME"
          else
            BASE_REF="HEAD"
            HEAD_REF="HEAD"
            BRANCH_NAME="$GITHUB_REF_NAME"
          fi
          echo "Program history range: $BASE_REF...$HEAD_REF"
          python scripts/check-program-plan-integrity.py --base-ref "$BASE_REF"
          if [ "${{ steps.task-context.outputs.task_specific }}" = "true" ]; then
            python scripts/check-program-plan-history.py \
              --base-ref "$BASE_REF" \
              --head-ref "$HEAD_REF" \
              --task "${{ steps.task-context.outputs.task_id }}" \
              --branch-name "$BRANCH_NAME"
            python scripts/check-program-plan-transitions.py \
              --base-ref "$BASE_REF" \
              --head-ref "$HEAD_REF" \
              --task "${{ steps.task-context.outputs.task_id }}" \
              --branch-name "$BRANCH_NAME"
            python scripts/check-program-plan-finalization.py \
              --base-ref "$BASE_REF" \
              --head-ref "$HEAD_REF" \
              --task "${{ steps.task-context.outputs.task_id }}"
            python scripts/check-program-lifecycle-guards.py \
              --base-ref "$BASE_REF" \
              --head-ref "$HEAD_REF" \
              --task "${{ steps.task-context.outputs.task_id }}" \
              --branch-name "$BRANCH_NAME"
          else
            python scripts/check-program-plan-history.py \
              --base-ref "$BASE_REF" \
              --head-ref "$HEAD_REF"
            python scripts/check-program-plan-transitions.py \
              --base-ref "$BASE_REF" \
              --head-ref "$HEAD_REF"
            python scripts/check-program-plan-finalization.py \
              --base-ref "$BASE_REF" \
              --head-ref "$HEAD_REF"
            python scripts/check-program-lifecycle-guards.py \
              --base-ref "$BASE_REF" \
              --head-ref "$HEAD_REF"
          fi

      - name: Agent coordination check
        id: agent-coordination
        if: success() || failure()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${{ steps.task-context.outputs.task_specific }}" != "true" ]; then
            python scripts/run-agent-coordination-gate.py
          elif [ -n "${GITHUB_HEAD_REF:-}" ]; then
            python scripts/run-agent-coordination-gate.py \
              --task "${{ steps.task-context.outputs.task_id }}" \
              --base-ref "origin/$GITHUB_BASE_REF" \
              --head-ref "HEAD" \
              --branch-name "$GITHUB_HEAD_REF"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO_SHA" ] && git rev-parse --verify "$PUSH_BEFORE^{commit}" >/dev/null 2>&1; then
            python scripts/run-agent-coordination-gate.py \
              --task "${{ steps.task-context.outputs.task_id }}" \
              --base-ref "$PUSH_BEFORE" \
              --head-ref HEAD \
              --branch-name "$GITHUB_REF_NAME"
          else
            python scripts/run-agent-coordination-gate.py \
              --task "${{ steps.task-context.outputs.task_id }}" \
              --base-ref HEAD^ \
              --head-ref HEAD \
              --branch-name "$GITHUB_REF_NAME"
          fi

      - name: Markdown basic check
        id: markdown-check
        if: success() || failure()
        run: |
          set -euo pipefail
          python scripts/check-markdown.py

      - name: YAML/JSON schema check
        id: schema-check
        if: success() || failure()
        run: |
          set -euo pipefail
          python scripts/check-schemas.py

      - name: Secret scan
        id: secret-scan
        if: success() || failure()
        run: |
          set -euo pipefail
          python scripts/check-secrets.py

      - name: Evidence check
        id: evidence-check
        if: (success() || failure()) && steps.task-context.outputs.task_specific == 'true'
        run: |
          set -euo pipefail
          python scripts/check-evidence.py --task "${{ steps.task-context.outputs.task_id }}"

      - name: Evidence integrity check
        id: evidence-integrity
        if: (success() || failure()) && steps.task-context.outputs.task_specific == 'true'
        run: |
          set -euo pipefail
          TASK_ID="${{ steps.task-context.outputs.task_id }}"
          EVIDENCE_DIR="evidence/$TASK_ID"
          REPORT=""
          if [ -f "$EVIDENCE_DIR/final-report-r5-clean-recovery.md" ]; then
            REPORT="$EVIDENCE_DIR/final-report-r5-clean-recovery.md"
          else
            REPORT=$(find "$EVIDENCE_DIR" -maxdepth 1 -type f -name 'final-report-r*.md' -print | sort -V | tail -n 1 || true)
          fi
          if [ -z "$REPORT" ] && [ -f "$EVIDENCE_DIR/final-report.md" ]; then REPORT="$EVIDENCE_DIR/final-report.md"; fi
          if [ -n "$REPORT" ]; then
            python scripts/check-evidence-integrity.py --task "$TASK_ID" --report "$REPORT"
          else
            echo "No final-report*.md exists for $TASK_ID; no commit claims require integrity validation."
          fi

      - name: Task-branch linkage check
        id: linkage-check
        if: (success() || failure()) && steps.task-context.outputs.task_specific == 'true' && github.head_ref != ''
        run: |
          set -euo pipefail
          python scripts/check-pr-task-link.py --branch "$GITHUB_HEAD_REF"

      - name: Scope check
        id: scope-check
        if: (success() || failure()) && steps.task-context.outputs.task_specific == 'true'
        run: |
          set -euo pipefail
          python scripts/run-task-scope-gate.py \
            --task "${{ steps.task-context.outputs.task_id }}" \
            --base origin/main

      - name: Spec sync check
        id: spec-sync
        if: success() || failure()
        run: |
          set -euo pipefail
          python scripts/check-spec-sync.py --base origin/main

      - name: Parent directory reference check
        id: parent-dir-check
        if: success() || failure()
        run: |
          set -euo pipefail
          EXIT_CODE=0
          if grep -rnE '\.\./tests/|/workspace/tests/' Makefile scripts/; then EXIT_CODE=1; fi
          exit $EXIT_CODE

      - name: CI workflow static validation
        id: ci-validation
        if: success() || failure()
        run: |
          set -euo pipefail
          python tests/governance/test_repository_boundary.py TestCIWorkflowStatic

      - name: Generate governance report
        id: summary
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_PYTHON: ${{ steps.setup-python.outcome }}
          INSTALL_DEPS: ${{ steps.install-deps.outcome }}
          VERIFY_DEPS: ${{ steps.verify-deps.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          TASK_CONTEXT: ${{ steps.task-context.outcome }}
          TASK_FILE: ${{ steps.task-file-validation.outcome }}
          PROJECT_READINESS: ${{ steps.project-readiness.outcome }}
          PROGRAM_INTEGRITY: ${{ steps.program-integrity.outcome }}
          AGENT_COORDINATION: ${{ steps.agent-coordination.outcome }}
          MARKDOWN: ${{ steps.markdown-check.outcome }}
          SCHEMA: ${{ steps.schema-check.outcome }}
          SECRET_SCAN: ${{ steps.secret-scan.outcome }}
          EVIDENCE: ${{ steps.evidence-check.outcome }}
          EVIDENCE_INTEGRITY: ${{ steps.evidence-integrity.outcome }}
          LINKAGE: ${{ steps.linkage-check.outcome }}
          SCOPE: ${{ steps.scope-check.outcome }}
          SPEC_SYNC: ${{ steps.spec-sync.outcome }}
          PARENT_DIR: ${{ steps.parent-dir-check.outcome }}
          CI_VALIDATION: ${{ steps.ci-validation.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Governance Gate Report"
            echo
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| checkout | $CHECKOUT |"
            echo "| setup_python | $SETUP_PYTHON |"
            echo "| install_deps | $INSTALL_DEPS |"
            echo "| verify_deps | $VERIFY_DEPS |"
            echo "| compile | $COMPILE |"
            echo "| task_context | $TASK_CONTEXT |"
            echo "| task_file_validation | $TASK_FILE |"
            echo "| project_readiness | $PROJECT_READINESS |"
            echo "| program_integrity | $PROGRAM_INTEGRITY |"
            echo "| agent_coordination | $AGENT_COORDINATION |"
            echo "| markdown_check | $MARKDOWN |"
            echo "| schema_check | $SCHEMA |"
            echo "| secret_scan | $SECRET_SCAN |"
            echo "| evidence_check | $EVIDENCE |"
            echo "| evidence_integrity | $EVIDENCE_INTEGRITY |"
            echo "| linkage_check | $LINKAGE |"
            echo "| scope_check | $SCOPE |"
            echo "| spec_sync | $SPEC_SYNC |"
            echo "| parent_dir_check | $PARENT_DIR |"
            echo "| ci_validation | $CI_VALIDATION |"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
          } >> "$GITHUB_STEP_SUMMARY"

  governance-tests:
    name: Governance Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: 1
      GOVERNANCE_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install governance dependencies
        id: install-deps
        run: |
          set -euo pipefail
          pip install -r requirements-governance.txt pytest-xdist==3.8.0

      - name: Governance tests
        id: governance-tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/test-results
          python -m pytest --collect-only -q --color=no tests/governance/ > /tmp/test-results/collection.txt
          python scripts/select-governance-cases.py select /tmp/test-results/collection.txt "$GOVERNANCE_SHARD" > /tmp/test-results/cases.txt
          mapfile -t governance_cases < /tmp/test-results/cases.txt
          python -m pytest "${governance_cases[@]}" -v -ra -o xfail_strict=true --junitxml=/tmp/test-results/governance-junit.xml -n 2 --dist loadfile --max-worker-restart=0

      - name: Skip and coverage audit
        if: success() || failure()
        run: |
          set -euo pipefail
          python scripts/check-pytest-skips.py /tmp/test-results/governance-junit.xml tests/governance/allowed-skips.txt
          python scripts/select-governance-cases.py audit /tmp/test-results/collection.txt "$GOVERNANCE_SHARD" /tmp/test-results/governance-junit.xml /tmp/test-results/result.json "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT"

      - name: Publish shard coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governance-shard-${{ github.run_attempt }}-${{ matrix.shard }}
          path: /tmp/test-results/result.json
          if-no-files-found: error
          retention-days: 14

  governance-check:
    name: Governance Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [governance-controls, governance-tests]
    if: ${{ always() }}
    steps:
      - name: Require controls and all governance shards
        env:
          CONTROLS_RESULT: ${{ needs.governance-controls.result }}
          TESTS_RESULT: ${{ needs.governance-tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Governance controls: %s\nGovernance test shards: %s\n' "$CONTROLS_RESULT" "$TESTS_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$CONTROLS_RESULT" = success
          test "$TESTS_RESULT" = success

      - name: Checkout coverage checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scripts/select-governance-cases.py
          sparse-checkout-cone-mode: false

      - name: Retrieve shard coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: governance-shard-${{ github.run_attempt }}-*
          path: /tmp/governance-receipts

      - name: Verify complete original coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/select-governance-cases.py combine /tmp/governance-receipts "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT"
