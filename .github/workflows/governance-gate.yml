name: Governance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: 'Task ID to validate (e.g., GZ-003)'
        required: false
        default: ''

concurrency:
  group: governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance-check:
    name: Governance Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python 3.11
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install governance dependencies
        id: install-deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-governance.txt
          echo "--- Installed packages ---"
          pip freeze | grep -E 'pytest|PyYAML|jsonschema'

      - name: Verify core dependencies importable
        id: verify-deps
        run: |
          set -euo pipefail
          python -c "import yaml, pytest, jsonschema; print('OK: All dependencies importable')"

      - name: Compile scripts and tests
        id: compile
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests

      - name: Pytest collect-only
        id: collect-tests
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q tests/governance/

      - name: Resolve task context
        id: task-context
        run: |
          set -euo pipefail
          TASK_ID="${{ github.event.inputs.task }}"
          REF_NAME="${{ github.head_ref || github.ref_name }}"
          if [ -z "$TASK_ID" ] && [[ "$REF_NAME" =~ ^(feat|fix|docs|refactor|chore)/([A-Z]+-[0-9]+)-.+$ ]]; then
            TASK_ID="${BASH_REMATCH[2]}"
          fi
          if [ -z "$TASK_ID" ] && [ -n "${{ github.head_ref }}" ]; then
            echo "::error::Pull-request branch '$REF_NAME' does not follow <type>/<TASK-ID>-<short-name>."
            exit 1
          fi
          if [ -n "$TASK_ID" ]; then
            echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
            echo "task_specific=true" >> "$GITHUB_OUTPUT"
            echo "Resolved task: $TASK_ID"
          else
            echo "task_id=" >> "$GITHUB_OUTPUT"
            echo "task_specific=false" >> "$GITHUB_OUTPUT"
            echo "Non-task ref '$REF_NAME'; repository-wide checks will run and task-specific checks will be skipped."
          fi

      - name: Task file validation
        id: task-file-validation
        if: steps.task-context.outputs.task_specific == 'true'
        run: |
          set -euo pipefail
          python scripts/check-task-file.py --task "${{ steps.task-context.outputs.task_id }}"

      - name: Project readiness check
        id: project-readiness
        if: success() || failure()
        run: |
          set -euo pipefail
          python scripts/check-project-readiness.py

      - name: Program Plan integrity and history check
        id: program-integrity
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.head_ref }}" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
            HEAD_REF="HEAD"
            BRANCH_NAME="${{ github.head_ref }}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE_REF="HEAD^"
            HEAD_REF="HEAD"
            BRANCH_NAME="${{ github.ref_name }}"
          else
            BASE_REF="HEAD"
            HEAD_REF="HEAD"
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          python scripts/check-program-plan-integrity.py --base-ref "$BASE_REF"
          if [ "${{ steps.task-context.outputs.task_specific }}" = "true" ]; then
            python scripts/check-program-plan-history.py \
              --base-ref "$BASE_REF" \
              --head-ref "$HEAD_REF" \
              --task "${{ steps.task-context.outputs.task_id }}" \
              --branch-name "$BRANCH_NAME"
          else
            python scripts/check-program-plan-history.py \
              --base-ref "$BASE_REF" \
              --head-ref "$HEAD_REF"
          fi

      - name: Agent coordination check
        id: agent-coordination
        if: success() || failure()
        run: |
          set -euo pipefail
          if [ "${{ steps.task-context.outputs.task_specific }}" != "true" ]; then
            python scripts/check-agent-coordination.py
          elif [ -n "${{ github.head_ref }}" ]; then
            python scripts/check-agent-coordination.py \
              --task "${{ steps.task-context.outputs.task_id }}" \
              --base-ref "origin/${{ github.base_ref }}" \
              --head-ref "HEAD" \
              --branch-name "${{ github.head_ref }}"
          else
            python scripts/check-agent-coordination.py \
              --task "${{ steps.task-context.outputs.task_id }}" \
              --base-ref HEAD^ \
              --head-ref HEAD \
              --branch-name "${{ github.ref_name }}"
          fi

      - name: Governance tests
        id: governance-tests
        if: success() || failure()
        run: |
          set -euo pipefail
          mkdir -p /tmp/test-results
          python -m pytest tests/governance/ -v -ra --junitxml=/tmp/test-results/governance-junit.xml

      - name: Skip audit
        id: skip-audit
        if: success() || failure()
        run: |
          set -euo pipefail
          if [ ! -f /tmp/test-results/governance-junit.xml ]; then
            echo "::error::JUnit XML not found; governance tests did not produce auditable results."
            exit 1
          fi
          python scripts/check-pytest-skips.py /tmp/test-results/governance-junit.xml tests/governance/allowed-skips.txt

      - name: Markdown basic check
        id: markdown-check
        if: success() || failure()
        run: |
          set -euo pipefail
          python scripts/check-markdown.py

      - name: YAML/JSON schema check
        id: schema-check
        if: success() || failure()
        run: |
          set -euo pipefail
          python scripts/check-schemas.py

      - name: Secret scan
        id: secret-scan
        if: success() || failure()
        run: |
          set -euo pipefail
          python scripts/check-secrets.py

      - name: Evidence check
        id: evidence-check
        if: (success() || failure()) && steps.task-context.outputs.task_specific == 'true'
        run: |
          set -euo pipefail
          python scripts/check-evidence.py --task "${{ steps.task-context.outputs.task_id }}"

      - name: Evidence integrity check
        id: evidence-integrity
        if: (success() || failure()) && steps.task-context.outputs.task_specific == 'true'
        run: |
          set -euo pipefail
          TASK_ID="${{ steps.task-context.outputs.task_id }}"
          EVIDENCE_DIR="evidence/$TASK_ID"
          REPORT=""
          if [ -f "$EVIDENCE_DIR/final-report-r5-clean-recovery.md" ]; then
            REPORT="$EVIDENCE_DIR/final-report-r5-clean-recovery.md"
          else
            REPORT=$(find "$EVIDENCE_DIR" -maxdepth 1 -type f -name 'final-report-r*.md' -print | sort -V | tail -n 1 || true)
          fi
          if [ -z "$REPORT" ] && [ -f "$EVIDENCE_DIR/final-report.md" ]; then
            REPORT="$EVIDENCE_DIR/final-report.md"
          fi
          if [ -n "$REPORT" ]; then
            python scripts/check-evidence-integrity.py --task "$TASK_ID" --report "$REPORT"
          else
            echo "No final-report*.md exists for $TASK_ID; no commit claims require integrity validation."
          fi

      - name: Task-branch linkage check
        id: linkage-check
        if: (success() || failure()) && steps.task-context.outputs.task_specific == 'true' && github.head_ref != ''
        run: |
          set -euo pipefail
          python scripts/check-pr-task-link.py --branch "${{ github.head_ref }}"

      - name: Scope check
        id: scope-check
        if: (success() || failure()) && steps.task-context.outputs.task_specific == 'true'
        run: |
          set -euo pipefail
          python scripts/check-task-scope.py --task "${{ steps.task-context.outputs.task_id }}" --base origin/main

      - name: Spec sync check
        id: spec-sync
        if: success() || failure()
        run: |
          set -euo pipefail
          python scripts/check-spec-sync.py --base origin/main

      - name: Parent directory reference check
        id: parent-dir-check
        if: success() || failure()
        run: |
          set -euo pipefail
          EXIT_CODE=0
          if grep -rnE '\.\./tests/|/workspace/tests/' Makefile scripts/; then EXIT_CODE=1; fi
          exit $EXIT_CODE

      - name: CI workflow static validation
        id: ci-validation
        if: success() || failure()
        run: |
          set -euo pipefail
          python tests/governance/test_repository_boundary.py TestCIWorkflowStatic

      - name: Generate governance report
        id: summary
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_PYTHON: ${{ steps.setup-python.outcome }}
          INSTALL_DEPS: ${{ steps.install-deps.outcome }}
          VERIFY_DEPS: ${{ steps.verify-deps.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          COLLECT_TESTS: ${{ steps.collect-tests.outcome }}
          TASK_CONTEXT: ${{ steps.task-context.outcome }}
          TASK_FILE: ${{ steps.task-file-validation.outcome }}
          PROJECT_READINESS: ${{ steps.project-readiness.outcome }}
          PROGRAM_INTEGRITY: ${{ steps.program-integrity.outcome }}
          AGENT_COORDINATION: ${{ steps.agent-coordination.outcome }}
          GOVERNANCE_TESTS: ${{ steps.governance-tests.outcome }}
          SKIP_AUDIT: ${{ steps.skip-audit.outcome }}
          MARKDOWN: ${{ steps.markdown-check.outcome }}
          SCHEMA: ${{ steps.schema-check.outcome }}
          SECRET_SCAN: ${{ steps.secret-scan.outcome }}
          EVIDENCE: ${{ steps.evidence-check.outcome }}
          EVIDENCE_INTEGRITY: ${{ steps.evidence-integrity.outcome }}
          LINKAGE: ${{ steps.linkage-check.outcome }}
          SCOPE: ${{ steps.scope-check.outcome }}
          SPEC_SYNC: ${{ steps.spec-sync.outcome }}
          PARENT_DIR: ${{ steps.parent-dir-check.outcome }}
          CI_VALIDATION: ${{ steps.ci-validation.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Governance Gate Report"
            echo
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| checkout | $CHECKOUT |"
            echo "| setup_python | $SETUP_PYTHON |"
            echo "| install_deps | $INSTALL_DEPS |"
            echo "| verify_deps | $VERIFY_DEPS |"
            echo "| compile | $COMPILE |"
            echo "| collect_tests | $COLLECT_TESTS |"
            echo "| task_context | $TASK_CONTEXT |"
            echo "| task_file_validation | $TASK_FILE |"
            echo "| project_readiness | $PROJECT_READINESS |"
            echo "| program_integrity | $PROGRAM_INTEGRITY |"
            echo "| agent_coordination | $AGENT_COORDINATION |"
            echo "| governance_tests | $GOVERNANCE_TESTS |"
            echo "| skip_audit | $SKIP_AUDIT |"
            echo "| markdown_check | $MARKDOWN |"
            echo "| schema_check | $SCHEMA |"
            echo "| secret_scan | $SECRET_SCAN |"
            echo "| evidence_check | $EVIDENCE |"
            echo "| evidence_integrity | $EVIDENCE_INTEGRITY |"
            echo "| linkage_check | $LINKAGE |"
            echo "| scope_check | $SCOPE |"
            echo "| spec_sync | $SPEC_SYNC |"
            echo "| parent_dir_check | $PARENT_DIR |"
            echo "| ci_validation | $CI_VALIDATION |"
            echo
            echo "Commit: ${{ github.sha }}"
            echo "Ref: ${{ github.ref }}"
          } >> "$GITHUB_STEP_SUMMARY"
