name: GZ-010 Repair Script Hotfix

on:
  push:
    branches:
      - chore/GZ-010-poc-program-baseline
    paths:
      - ".github/workflows/gz010-repair-script-hotfix.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/GZ-010-poc-program-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Patch validator and fixture directly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import zlib
          payload = ""
          source = zlib.decompress(base64.b64decode(payload))
          code = compile(source, "/tmp/gz010_direct_patch.py", "exec")
          exec(code, {"__name__": "__main__"})
          PY

          python -m py_compile specs/poc/check_program.py specs/poc/test_program.py
          python -m pip install -r requirements-governance.txt
          python specs/poc/check_program.py
          python specs/poc/test_program.py
          git diff --check

          rm -f \
            .github/workflows/gz010-direct-validation.yml \
            .github/workflows/gz010-execution-contract-repair.yml \
            .github/workflows/gz010-execution-contract-repair-v2.yml \
            .github/workflows/gz010-execution-contract-repair-v3.yml \
            .github/workflows/gz010-repair-script-hotfix-v2.yml \
            .github/workflows/gz010-repair-script-hotfix.yml

          git config user.name "guize-governance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/poc/check_program.py specs/poc/test_program.py \
            .github/workflows/gz010-direct-validation.yml \
            .github/workflows/gz010-execution-contract-repair.yml \
            .github/workflows/gz010-execution-contract-repair-v2.yml \
            .github/workflows/gz010-execution-contract-repair-v3.yml \
            .github/workflows/gz010-repair-script-hotfix-v2.yml \
            .github/workflows/gz010-repair-script-hotfix.yml
          git commit -m "fix(GZ-010): align execution contract and remove repair workflows"
          git push origin HEAD:chore/GZ-010-poc-program-baseline
