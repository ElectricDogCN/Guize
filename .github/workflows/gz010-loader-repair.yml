name: GZ-010 One-shot Loader Repair

on:
  push:
    branches:
      - chore/GZ-010-poc-program-baseline
    paths:
      - ".github/workflows/gz010-loader-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/GZ-010-poc-program-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Apply loader repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("specs/poc/check_program.py")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"def _construct_unique_mapping\([\s\S]*?\n\n\nUniqueKeyLoader\.add_constructor",
          )
          replacement = '''def _construct_unique_mapping(
              loader: yaml.SafeLoader,
              node: yaml.MappingNode,
              deep: bool = False,
          ):
              explicit: set[Any] = set()
              for key_node, _ in node.value:
                  if key_node.tag == "tag:yaml.org,2002:merge":
                      continue
                  key = loader.construct_object(key_node, deep=False)
                  try:
                      duplicate = key in explicit
                      explicit.add(key)
                  except TypeError as exc:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          f"found unhashable key: {key!r}",
                          key_node.start_mark,
                      ) from exc
                  if duplicate:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          f"found duplicate key: {key!r}",
                          key_node.start_mark,
                      )
              loader.flatten_mapping(node)
              return yaml.SafeLoader.construct_mapping(loader, node, deep=deep)


          UniqueKeyLoader.add_constructor'''.replace("          ", "")
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f"expected one loader function boundary, found {count}")
          path.write_text(updated, encoding="utf-8")
          PY
          rm .github/workflows/gz010-loader-repair.yml
          python -m py_compile specs/poc/check_program.py
          git diff --check
          git config user.name "guize-governance-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/poc/check_program.py .github/workflows/gz010-loader-repair.yml
          git commit -m "fix(GZ-010): preserve YAML merge keys in strict loader"
          git push origin HEAD:chore/GZ-010-poc-program-baseline
