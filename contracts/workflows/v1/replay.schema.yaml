$schema: https://json-schema.org/draft/2020-12/schema
title: Guize normalized Workflow replay input
type: object
additionalProperties: false
required: [schemaVersion, workflowType, taskId, planId, planVersion, policyVersionId, steps, recorded, cancellationRequested]
properties:
  schemaVersion: {const: 1}
  workflowType: {type: string, pattern: '^[A-Za-z]+Workflow$'}
  taskId: {$ref: '#/$defs/id'}
  planId: {$ref: '#/$defs/id'}
  planVersion: {type: integer, minimum: 1, maximum: 9007199254740991}
  policyVersionId: {$ref: '#/$defs/id'}
  cancellationRequested: {type: boolean}
  steps:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [stepId, activity, dependsOn, inputRef]
      properties:
        stepId: {$ref: '#/$defs/id'}
        activity: {type: string, pattern: '^[a-z][a-zA-Z0-9]*$'}
        dependsOn: {type: array, uniqueItems: true, items: {$ref: '#/$defs/id'}}
        inputRef: {$ref: '#/$defs/id'}
  recorded:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [stepId, idempotencyKey, policyVersionId, status]
      properties:
        stepId: {$ref: '#/$defs/id'}
        idempotencyKey: {type: string, minLength: 1, maxLength: 384}
        policyVersionId: {$ref: '#/$defs/id'}
        status: {enum: [SCHEDULED, COMPLETED]}
        outcomeRef: {$ref: '#/$defs/id'}
      if: {properties: {status: {const: COMPLETED}}}
      then: {required: [outcomeRef]}
      else: {not: {required: [outcomeRef]}}
$defs:
  id: {type: string, pattern: '^[a-z]{2,12}_[A-Za-z0-9_-]{1,64}$'}
