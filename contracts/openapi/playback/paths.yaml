    x-idempotency:
      scope: authenticated subject (or pre-auth client session)+operationId+key
      fingerprint: SHA-256 of canonical method+normalized path resource IDs+query+body; identity is server-derived
      retentionSeconds: 86400
      samePayload: replay durable non-sensitive result only after current authorization
      differentPayload: INTERNAL_IDEMPOTENCY_CONFLICT, including a different path resource
      inFlight: INTERNAL_IDEMPOTENCY_IN_PROGRESS; retry after bounded backoff.
      reauthorization: recheck current authentication, resource/source ACL, step-up and approval validity before replay
      expiredEphemeralResult: never replay expired session/proof/grant; require a fresh key and reauthorization; no renewed side effect
      durability: transactional unique claim; task dedupe survives workflow retries
    requestBody:
      required: true
      description: Schema-validated bounded input.
      x-i18n:
        en-US:
          description: Schema-validated bounded input.
        zh-CN:
          description: 经 Schema 校验的有界输入。
      content:
        application/json:
          schema:
            $ref: ../common/schemas.yaml#/PlaybackProgressInput
          examples:
            illustrative:
              summary: Illustrative contract value; not live execution.
              description: Illustrative contract value; not live execution.
              x-i18n:
                en-US:
                  description: Illustrative contract value; not live execution.
                  summary: Illustrative contract value; not live execution.
                zh-CN:
                  description: 契约说明值，不是线上执行结果。
                  summary: 契约说明值，不是线上执行结果。
              value:
                versionId: ver_example01
                positionMs: 42000
                durationMs: 120000
                completed: false
                lastPlayedAt: '2026-10-09T12:00:00Z'
                deviceId: dev_example01
    x-resource-binding:
      primary: path.assetId
      related:
      - body.versionId
      invariants:
      - Resolve versionId within path.assetId and authenticated subject before reading or writing progress.
      - Reject absent, unauthorized or foreign versions with the same redacted not-found response.
      - Stored progress is keyed by authenticated subject + path.assetId + resolved immutable versionId.
    x-progress-ordering:
      scope: Authenticated subject + path.assetId + authorized body.versionId
      maxFutureSkewSeconds: 300
      effectiveTimestamp: min(body.lastPlayedAt, server.receivedAt)
      tieBreak: server.perKeyReceiptSequence
      atomicMerge: Reject timestamps over server.receivedAt + 300 seconds with INTERNAL_INVALID_REQUEST. Persist and return the clamped timestamp. Under a per-key transaction compare (effectiveTimestamp, strictly increasing server receipt sequence); stale older timestamps never overwrite newer progress. Position may decrease on seek.
      replay: An idempotent replay reauthorizes but keeps its original timestamp and receipt sequence; it cannot obtain new ordering priority.
