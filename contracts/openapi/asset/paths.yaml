/assets/{assetId}:
  get:
    operationId: getAsset
    summary: Read an authorized logical asset
    description: Read an authorized logical asset
    x-i18n:
      en-US:
        description: Read an authorized logical asset
        summary: Read an authorized logical asset
      zh-CN:
        description: 读取经授权逻辑资产
        summary: 读取经授权逻辑资产
    tags:
    - asset
    security:
    - SessionCookie: []
    - BearerAuth: []
    x-module-id: MOD-ASSET
    x-requirement-ids:
    - REQ-V1-0002
    - REQ-V1-0008
    x-authorization:
      mode: AUTHENTICATED
      permission: asset.read
      scope: subject+resource ACL+source policy; deny before hydration; anonymous only explicit safe published assets
      stepUp: false
      approval: false
    x-error-codes:
    - AUTH_REQUIRED
    - AUTH_INVALID
    - ACCESS_DENIED
    - ACCESS_NOT_FOUND
    - INTERNAL_INVALID_REQUEST
    - INTERNAL_RATE_LIMITED
    - INTERNAL_UNAVAILABLE
    - INTERNAL_ERROR
    - ASSET_HASH_UNVERIFIED
    - ASSET_MERGE_CONFLICT
    - SECURITY_CONTENT_BLOCKED
    parameters:
    - name: Accept-Language
      in: header
      required: false
      description: Response language; unsupported language falls back to zh-CN.
      x-i18n:
        en-US:
          description: Response language; unsupported language falls back to zh-CN.
        zh-CN:
          description: 响应语言，不支持的语言回退至 zh-CN。
      schema:
        type: string
        enum:
        - zh-CN
        - en-US
        default: zh-CN
    - name: assetId
      in: path
      required: true
      description: Resource identifier or exact optimistic revision, resolved after authorization.
      x-i18n:
        en-US:
          description: Resource identifier or exact optimistic revision, resolved after authorization.
        zh-CN:
          description: 鉴权后解析的资源标识或精确乐观修订号。
      schema: &id004
        type: string
        description: Opaque resource identifier; never a file path.
        x-i18n:
          en-US:
            description: Opaque resource identifier; never a file path.
          zh-CN:
            description: 不透明资源标识，不是文件路径。
