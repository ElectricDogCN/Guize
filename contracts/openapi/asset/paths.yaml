    x-resource-binding:
      primary: path.assetId
      related:
      - path.versionId
      invariants:
      - Resolve versionId within assetId and current security administrator authority before reading findings.
      - Every finding belongs to this exact immutable version/hash; return only redacted bounded metadata, retain raw scanner evidence separately.
      - Cursor binds subject, asset/version and evidence snapshot; reauthorize every page and reject foreign or stale cursors.
      - Finding id is the reviewFindingId consumed by releaseAssetQuarantine; approval reviews retained exact finding/version/hash and does not alter the original scan.
