/assets/{assetId}:probe:
  post:
    operationId: probeMedia
    summary: Probe a restricted versioned input
    description: Probe a restricted versioned input
    x-i18n:
      en-US:
        description: Probe a restricted versioned input
        summary: Probe a restricted versioned input
      zh-CN:
        description: 探测受限的版本化输入
        summary: 探测受限的版本化输入
    tags:
    - media
    security:
    - SessionCookie: []
    - BearerAuth: []
    x-module-id: MOD-MEDIA
    x-requirement-ids:
    - REQ-V1-0003
    - REQ-V1-0008
    x-authorization:
      mode: AUTHENTICATED
      permission: asset.process
      scope: subject+resource ACL+source policy; deny before hydration; anonymous only explicit safe published assets
      stepUp: false
      approval: false
    x-error-codes:
    - AUTH_REQUIRED
    - AUTH_INVALID
    - ACCESS_DENIED
    - ACCESS_NOT_FOUND
    - INTERNAL_INVALID_REQUEST
    - INTERNAL_RATE_LIMITED
    - INTERNAL_UNAVAILABLE
    - INTERNAL_ERROR
    - MEDIA_UNSUPPORTED
    - INTERNAL_IDEMPOTENCY_CONFLICT
    - INTERNAL_REVISION_CONFLICT
    parameters:
    - name: Accept-Language
      in: header
      required: false
      description: Response language; unsupported language falls back to zh-CN.
      x-i18n:
        en-US:
          description: Response language; unsupported language falls back to zh-CN.
        zh-CN:
          description: 响应语言，不支持的语言回退至 zh-CN。
      schema:
        type: string
        enum:
        - zh-CN
        - en-US
        default: zh-CN
    - name: assetId
      in: path
      required: true
      description: Resource identifier or exact optimistic revision, resolved after authorization.
      x-i18n:
        en-US:
          description: Resource identifier or exact optimistic revision, resolved after authorization.
        zh-CN:
          description: 鉴权后解析的资源标识或精确乐观修订号。
      schema: &id002
        type: string
        description: Opaque resource identifier; never a file path.
        x-i18n:
          en-US:
            description: Opaque resource identifier; never a file path.
          zh-CN:
            description: 不透明资源标识，不是文件路径。
        pattern: ^[a-z]{2,12}_[A-Za-z0-9_-]{1,64}$
        maxLength: 80
    - name: Idempotency-Key
      in: header
      required: true
      description: Caller+operation scoped key; same request replays original result for 24h.
      x-i18n:
        en-US:
          description: Caller+operation scoped key; same request replays original result for 24h.
        zh-CN:
          description: 按调用者与操作隔离，同请求在 24 小时内重放原结果。
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    - name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie sessions; machine bearer callers use scoped identity.
      x-i18n:
        en-US:
          description: Required for cookie sessions; machine bearer callers use scoped identity.
        zh-CN:
          description: Cookie 会话必须提供；机器 Bearer 使用受限身份。
      schema:
        type: string
        minLength: 32
        maxLength: 128
    responses:
      '202':
        description: Command accepted; poll task status.
        x-i18n:
          en-US:
            description: Command accepted; poll task status.
          zh-CN:
            description: 命令已受理，请查询任务状态。
        headers: &id001
          X-Trace-Id:
            description: Trace correlation matching envelope traceId.
            x-i18n:
              en-US:
                description: Trace correlation matching envelope traceId.
              zh-CN:
                description: 与响应 traceId 一致的关联标识。
            required: true
            schema: &id003
              type: string
              description: Request correlation identifier, including failures.
              x-i18n:
                en-US:
                  description: Request correlation identifier, including failures.
                zh-CN:
                  description: 包括失败请求在内的关联标识。
              pattern: ^[A-Za-z0-9-]{8,128}$
              maxLength: 128
          Cache-Control:
            description: Private control-plane responses must not be shared-cached.
            x-i18n:
              en-US:
                description: Private control-plane responses must not be shared-cached.
              zh-CN:
                description: 控制面私有响应不得共享缓存。
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/TaskAcceptedEnvelope
            examples:
              illustrative:
                summary: Illustrative contract value; not live execution.
                description: Illustrative contract value; not live execution.
                x-i18n:
                  en-US:
                    description: Illustrative contract value; not live execution.
                    summary: Illustrative contract value; not live execution.
                  zh-CN:
                    description: 契约说明值，不是线上执行结果。
                    summary: 契约说明值，不是线上执行结果。
                value: &id004
                  code: ACCEPTED
                  message: 请求已受理。
                  data:
                    taskId: tsk_example01
                    status: RUNNING
                    statusUrl: /api/v1/tasks/tsk_example01
                  traceId: trace-example-0001
