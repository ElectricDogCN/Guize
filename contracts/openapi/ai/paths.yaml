/artifacts/{artifactId}:publish:
  post:
    operationId: publishArtifact
    summary: Publish approved derivative without broadening ACL
    description: Publish approved derivative without broadening ACL
    x-i18n:
      en-US:
        description: Publish approved derivative without broadening ACL
        summary: Publish approved derivative without broadening ACL
      zh-CN:
        description: 发布已批准派生产物且不扩大 ACL
        summary: 发布已批准派生产物且不扩大 ACL
    tags:
    - ai
    security:
    - SessionCookie: []
    - BearerAuth: []
    x-module-id: MOD-AI
    x-requirement-ids:
    - REQ-V1-0004
    - REQ-V1-0008
    x-authorization:
      mode: AUTHENTICATED
      permission: asset.publish
      scope: subject+resource ACL+source policy; deny before hydration; anonymous only explicit safe published assets
      stepUp: true
      approval: true
    x-error-codes:
    - AUTH_REQUIRED
    - AUTH_INVALID
    - ACCESS_DENIED
    - ACCESS_NOT_FOUND
    - INTERNAL_INVALID_REQUEST
    - INTERNAL_RATE_LIMITED
    - INTERNAL_UNAVAILABLE
    - INTERNAL_ERROR
    - AI_DATA_POLICY_DENIED
    - AI_BUDGET_EXCEEDED
    - AI_PROFILE_UNAPPROVED
    - INTERNAL_IDEMPOTENCY_CONFLICT
    - INTERNAL_REVISION_CONFLICT
    - AUTH_STEP_UP_REQUIRED
    - POLICY_APPROVAL_REQUIRED
    parameters:
    - name: Accept-Language
      in: header
      required: false
      description: Response language; unsupported language falls back to zh-CN.
      x-i18n:
        en-US:
          description: Response language; unsupported language falls back to zh-CN.
        zh-CN:
          description: 响应语言，不支持的语言回退至 zh-CN。
      schema:
        type: string
        enum:
        - zh-CN
        - en-US
        default: zh-CN
    - name: artifactId
      in: path
      required: true
