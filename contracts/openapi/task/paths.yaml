      description: Results per page, maximum 100.
      x-i18n:
        en-US:
          description: Results per page, maximum 100.
        zh-CN:
          description: 每页结果，最多 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
