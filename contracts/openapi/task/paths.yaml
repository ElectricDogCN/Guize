        type: string
        enum:
        - zh-CN
        - en-US
        default: zh-CN
    - name: cursor
      in: query
      required: false
      description: Opaque scope-bound cursor.
      x-i18n:
        en-US:
          description: Opaque scope-bound cursor.
        zh-CN:
          description: 绑定权限范围的不透明游标。
      schema:
