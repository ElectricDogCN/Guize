/tasks/{taskId}:
  get:
    operationId: getTask
    summary: Read task state and progress
    description: Read task state and progress
    x-i18n:
      en-US:
        description: Read task state and progress
        summary: Read task state and progress
      zh-CN:
        description: 读取任务状态与进度
        summary: 读取任务状态与进度
    tags:
    - task
    security:
    - SessionCookie: []
    - BearerAuth: []
    x-module-id: MOD-TASK
    x-requirement-ids:
    - REQ-V1-0007
    - REQ-V1-0008
    x-authorization:
      mode: AUTHENTICATED
      permission: task.read
      scope: subject+resource ACL+source policy; deny before hydration; anonymous only explicit safe published assets
      stepUp: false
      approval: false
    x-error-codes:
    - AUTH_REQUIRED
    - AUTH_INVALID
    - ACCESS_DENIED
    - ACCESS_NOT_FOUND
    - INTERNAL_INVALID_REQUEST
    - INTERNAL_RATE_LIMITED
    - INTERNAL_UNAVAILABLE
    - INTERNAL_ERROR
    - TASK_INVALID_TRANSITION
    - TASK_BUDGET_BLOCKED
    parameters:
    - name: Accept-Language
      in: header
      required: false
      description: Response language; unsupported language falls back to zh-CN.
      x-i18n:
        en-US:
          description: Response language; unsupported language falls back to zh-CN.
        zh-CN:
          description: 响应语言，不支持的语言回退至 zh-CN。
      schema:
        type: string
        enum:
        - zh-CN
        - en-US
        default: zh-CN
    - name: taskId
      in: path
      required: true
      description: Resource identifier or exact optimistic revision, resolved after authorization.
      x-i18n:
        en-US:
          description: Resource identifier or exact optimistic revision, resolved after authorization.
        zh-CN:
          description: 鉴权后解析的资源标识或精确乐观修订号。
      schema: &id004
        type: string
        description: Opaque resource identifier; never a file path.
        x-i18n:
          en-US:
            description: Opaque resource identifier; never a file path.
          zh-CN:
            description: 不透明资源标识，不是文件路径。
        pattern: ^[a-z]{2,12}_[A-Za-z0-9_-]{1,64}$
        maxLength: 80
    responses:
      '200':
        description: Authorized result.
        x-i18n:
          en-US:
            description: Authorized result.
          zh-CN:
            description: 经授权的结果。
