  version: 1.0.0
  description: Versioned control-plane API baseline; implementation and production acceptance remain separate.
  x-i18n:
    en-US:
      description: Versioned control-plane API baseline; implementation and production acceptance remain separate.
      title: Guize V1 Control API
    zh-CN:
      description: 版本化控制面接口基线，实现与生产验收另行执行。
      title: 归泽 V1 控制面接口
