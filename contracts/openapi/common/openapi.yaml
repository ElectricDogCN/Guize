components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: guize_session
      description: Secure HttpOnly SameSite session; CSRF required for writes.
      x-i18n:
        en-US:
          description: Secure HttpOnly SameSite session; CSRF required for writes.
        zh-CN:
          description: Secure HttpOnly SameSite 会话，写操作必须防护 CSRF。
    BearerAuth:
      type: http
      scheme: bearer
      description: Short-lived scoped user/machine token, never source credentials.
      x-i18n:
        en-US:
          description: Short-lived scoped user/machine token, never source credentials.
        zh-CN:
          description: 受限的短期用户或机器令牌，不是来源凭据。
