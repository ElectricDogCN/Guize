ReauthenticationProof:
  type: object
  description: Fresh configured reauthentication, including first passkey enrollment.
  x-i18n:
    en-US:
      description: Fresh configured reauthentication, including first passkey enrollment.
    zh-CN:
      description: 近期配置认证方式，支持首次 Passkey 登记。
  additionalProperties: false
  properties:
    method:
      type: string
      description: Configured fresh authentication method.
      x-i18n:
        en-US:
          description: Configured fresh authentication method.
        zh-CN:
          description: 配置的近期认证方式。
      enum:
      - PASSWORD
      - PASSKEY
      - TOTP
    password:
      type: string
      description: Write-only current password, never echoed.
      x-i18n:
        en-US:
          description: Write-only current password, never echoed.
        zh-CN:
          description: 仅输入当前密码，禁止回显。
      minLength: 1
      maxLength: 1024
      writeOnly: true
    totpCode:
      type: string
      description: One-time configured TOTP proof.
      x-i18n:
        en-US:
          description: One-time configured TOTP proof.
        zh-CN:
          description: 已配置的一次性 TOTP 凭证。
      pattern: ^[0-9]{6}$
      writeOnly: true
    passkeyAssertion:
      $ref: ../common/schemas.yaml#/PasskeyAssertion
  required:
  - method
  oneOf:
  - properties:
      method:
        const: PASSWORD
    required:
    - password
    not:
      anyOf:
      - required:
        - passkeyAssertion
      - required:
        - totpCode
  - properties:
      method:
        const: PASSKEY
    required:
    - passkeyAssertion
    not:
      anyOf:
      - required:
        - password
      - required:
        - totpCode
  - properties:
      method:
        const: TOTP
    required:
    - totpCode
    not:
      anyOf:
      - required:
        - password
      - required:
        - passkeyAssertion
