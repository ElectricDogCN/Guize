TaskAccepted:
  type: object
  description: Accepted asynchronous command, not task success.
  x-i18n:
    en-US:
      description: Accepted asynchronous command, not task success.
    zh-CN:
      description: 异步命令已受理，不代表任务成功。
  additionalProperties: true
  properties:
    taskId: &id001
      type: string
      description: Opaque resource identifier; never a file path.
      x-i18n:
        en-US:
          description: Opaque resource identifier; never a file path.
        zh-CN:
          description: 不透明资源标识，不是文件路径。
      pattern: ^[a-z]{2,12}_[A-Za-z0-9_-]{1,64}$
      maxLength: 80
    status:
      type: string
      description: Observed task state at acceptance; not completed command outcome.
      x-i18n:
        en-US:
          description: Observed task state at acceptance; not completed command outcome.
        zh-CN:
          description: 受理时观测的任务状态，不代表命令已完成。
      enum:
      - CREATED
      - QUEUED
      - DISPATCHING
      - RUNNING
      - PAUSING
      - PAUSED
      - WAITING_RESOURCE
      - WAITING_BUDGET
      - WAITING_APPROVAL
      - RETRYING
    statusUrl:
      type: string
      description: Relative status resource.
      x-i18n:
        en-US:
          description: Relative status resource.
        zh-CN:
          description: 相对状态资源地址。
      pattern: ^/api/v1/tasks/tsk_[A-Za-z0-9_-]+$
  required:
  - taskId
  - status
  - statusUrl
