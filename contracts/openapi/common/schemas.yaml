      x-i18n:
        en-US:
          description: Allowed connector endpoint; SSRF policy checked server-side.
        zh-CN:
          description: 允许的连接器端点，服务端检查 SSRF 策略。
      minLength: 1
      maxLength: 2048
    credentialReference: &id005
      type: string
      description: Authorized OpenBao reference only; no credential value.
      x-i18n:
        en-US:
          description: Authorized OpenBao reference only; no credential value.
        zh-CN:
          description: 仅允许经授权的 OpenBao 引用，不允许凭据正文。
      pattern: ^secretref_[A-Za-z0-9_-]{1,64}$
      maxLength: 74
    root:
      type: string
      description: Configured relative root or scoped mount alias.
      x-i18n:
        en-US:
          description: Configured relative root or scoped mount alias.
        zh-CN:
          description: 配置的相对根目录或受限挂载别名。
      minLength: 1
      maxLength: 2048
    visibility:
      type: string
      description: Default PRIVATE; public requires dedicated approval.
      x-i18n:
        en-US:
          description: Default PRIVATE; public requires dedicated approval.
        zh-CN:
          description: 默认 PRIVATE，公开需独立审批。
      enum:
      - PRIVATE
      - SHARED
  required:
  - name
  - kind
  - endpoint
  - root
  - visibility
  allOf:
  - if:
      properties:
        kind:
          const: LOCAL
      required:
      - kind
    then:
      properties:
        root:
          type: string
          minLength: 1
          maxLength: 2048
          format: source-root
          pattern: ^(?!/)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*[\\%:\x00-\x1f\x7f])[^/]+(?:/[^/]+)*(?![\s\S])
          description: Canonical relative path under the authorized LOCAL mount; no absolute path, traversal, escapes or backslashes.
          x-i18n:
            en-US:
              description: Canonical relative path under the authorized LOCAL mount; no absolute path, traversal, escapes or backslashes.
            zh-CN:
              description: 授权 LOCAL 挂载下的规范相对路径；禁止绝对路径、目录穿越、转义和反斜杠。
        endpoint:
          type: string
          pattern: ^mount:[a-z][a-z0-9_-]{0,63}(?![\s\S])
          description: Server-issued authorized LOCAL mount alias, never an arbitrary filesystem endpoint.
          x-i18n:
            en-US:
              description: Server-issued authorized LOCAL mount alias, never an arbitrary filesystem endpoint.
            zh-CN:
              description: 服务端签发且授权的 LOCAL 挂载别名，不接受任意文件系统端点。
  - if:
      properties:
        kind:
          enum:
          - WEBDAV
          - HTTP
          - BAIDU
          - GOOGLE_DRIVE
          - S3
          - ONEDRIVE
      required:
      - kind
    then:
      properties:
        endpoint:
          type: string
          minLength: 1
          maxLength: 2048
          format: credential-free-endpoint
          pattern: ^https?://(?![^/]*[@%\\])[^/?#\s]+(?:/[^?#\s\\]*)?(?![\s\S])
          description: Connector endpoint without URI userinfo, query or fragment; credentials only use the protected reference. Server independently enforces host allowlist, SSRF, redirects and provider policy.
          x-i18n:
            en-US:
