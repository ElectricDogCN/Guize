  post:
    operationId: createDataSource
    summary: Create a private data source
    description: Create a private data source
    x-i18n:
      en-US:
        description: Create a private data source
        summary: Create a private data source
      zh-CN:
        description: 创建私有数据源
        summary: 创建私有数据源
    tags:
    - source
    security:
    - SessionCookie: []
    - BearerAuth: []
    x-module-id: MOD-SOURCE
    x-requirement-ids:
    - REQ-V1-0001
    - REQ-V1-0002
    - REQ-V1-0008
    x-authorization:
      mode: AUTHENTICATED
      permission: source.create
      scope: subject+resource ACL+source policy; deny before hydration; anonymous only explicit safe published assets
      stepUp: true
      approval: false
    x-error-codes:
    - AUTH_REQUIRED
    - AUTH_INVALID
    - ACCESS_DENIED
    - ACCESS_NOT_FOUND
    - INTERNAL_INVALID_REQUEST
    - INTERNAL_RATE_LIMITED
    - INTERNAL_UNAVAILABLE
    - INTERNAL_ERROR
    - SOURCE_UNAVAILABLE
    - SOURCE_CREDENTIAL_REVOKED
    - SOURCE_POLICY_BLOCKED
    - INTERNAL_IDEMPOTENCY_CONFLICT
    - INTERNAL_IDEMPOTENCY_IN_PROGRESS
    - INTERNAL_REVISION_CONFLICT
    - AUTH_STEP_UP_REQUIRED
    - POLICY_APPROVAL_REQUIRED
    parameters:
    - name: Accept-Language
      in: header
      required: false
      description: Response language; unsupported language falls back to zh-CN.
      x-i18n:
        en-US:
          description: Response language; unsupported language falls back to zh-CN.
        zh-CN:
          description: 响应语言，不支持的语言回退至 zh-CN。
      schema:
        type: string
        enum:
        - zh-CN
        - en-US
        default: zh-CN
    - name: Idempotency-Key
      in: header
      required: true
      description: Caller+operation scoped key; same request replays original result for 24h.
      x-i18n:
        en-US:
          description: Caller+operation scoped key; same request replays original result for 24h.
        zh-CN:
          description: 按调用者与操作隔离，同请求在 24 小时内重放原结果。
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    - name: X-CSRF-Token
