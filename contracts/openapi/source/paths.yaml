                    description: Illustrative contract value; not live execution.
                    summary: Illustrative contract value; not live execution.
                  zh-CN:
                    description: 契约说明值，不是线上执行结果。
                    summary: 契约说明值，不是线上执行结果。
                value:
                  code: SUCCESS
                  message: 操作成功。
                  data:
                    items:
                    - id: src_example01
                      name: Example WebDAV
                      kind: WEBDAV
                      visibility: PRIVATE
                      ownerId: usr_example01
                      status: ACTIVE
                      revision: 1
                    nextCursor: null
                  traceId: trace-example-0001
      '400':
        description: Redacted failure; stable codes only.
