    x-resource-binding:
      primary: path.sourceId
      related:
      - body.platformAcl[*].principalId when visibility=SHARED or ADMIN_PUBLIC
      invariants:
      - Require authenticated source owner/proxy, current source authority, separated approval and recent exact step-up; transitions to/from ADMIN_PUBLIC also require administrator identity and source.publish.
      - Resolve each USER/ROLE principal through authorized identity inventory, check its type and grant authority, intersect platform capability/source policy and compare expectedRevision atomically. Complete explicit ACL is included in exact approval intent.
      - PRIVATE/SHARED/ADMIN_PUBLIC transitions preserve provider identity and source history; recheck/revoke obsolete source access and playback grants.
      - ADMIN_PUBLIC cannot implicitly publish Asset or expose provider token/path; each asset still needs its own publication, ACL and security checks.
      - SHARED and ADMIN_PUBLIC require explicit bounded platformAcl entries; empty is deny all. PRIVATE rejects supplied ACL and atomically removes shared ACL and revokes obsolete access. No implicit anonymous principal or resource scope is accepted.
    x-source-visibility-authorization:
      ownerTransitions:
      - PRIVATE
      - SHARED
      administratorTrigger: target visibility=ADMIN_PUBLIC OR current visibility=ADMIN_PUBLIC
      additionalCapability: source.publish
      administratorIdentityRequired: true
      invariants:
      - Verify source.owner and actual ownership/proxy authority before reading or changing ACL.
      - Any transition to/from an administrator public source also requires a server-verified administrator and source.publish; source.owner alone can never promote, demote or take over ADMIN_PUBLIC.
      - Step-up and independent approval bind exact target visibility, full ACL and current revision. PRIVATE retracts shared grants atomically; no automatic asset publication.
