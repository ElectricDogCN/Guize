/data-sources:
  get:
    operationId: listDataSources
    summary: List caller-visible data sources
    description: List caller-visible data sources
    x-i18n:
      en-US:
        description: List caller-visible data sources
        summary: List caller-visible data sources
      zh-CN:
        description: 列出调用者可见数据源
        summary: 列出调用者可见数据源
    tags:
    - source
    security:
    - SessionCookie: []
    - BearerAuth: []
    x-module-id: MOD-SOURCE
    x-requirement-ids:
    - REQ-V1-0001
    - REQ-V1-0002
    - REQ-V1-0008
    x-authorization:
      mode: AUTHENTICATED
      permission: source.read
      scope: subject+resource ACL+source policy; deny before hydration; anonymous only explicit safe published assets
      stepUp: false
      approval: false
    x-error-codes:
    - AUTH_REQUIRED
    - AUTH_INVALID
    - ACCESS_DENIED
    - ACCESS_NOT_FOUND
    - INTERNAL_INVALID_REQUEST
    - INTERNAL_RATE_LIMITED
    - INTERNAL_UNAVAILABLE
    - INTERNAL_ERROR
    - SOURCE_UNAVAILABLE
    - SOURCE_CREDENTIAL_REVOKED
    - SOURCE_POLICY_BLOCKED
    parameters:
    - name: Accept-Language
      in: header
      required: false
      description: Response language; unsupported language falls back to zh-CN.
      x-i18n:
        en-US:
          description: Response language; unsupported language falls back to zh-CN.
        zh-CN:
          description: 响应语言，不支持的语言回退至 zh-CN。
      schema:
        type: string
        enum:
        - zh-CN
        - en-US
        default: zh-CN
    - name: cursor
      in: query
      required: false
      description: Opaque scope-bound cursor.
      x-i18n:
        en-US:
          description: Opaque scope-bound cursor.
        zh-CN:
          description: 绑定权限范围的不透明游标。
      schema:
        type: string
        maxLength: 2048
    - name: limit
      in: query
      required: false
      description: Results per page, maximum 100.
      x-i18n:
        en-US:
          description: Results per page, maximum 100.
        zh-CN:
          description: 每页结果，最多 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    responses:
      '200':
        description: Authorized result.
        x-i18n:
          en-US:
            description: Authorized result.
          zh-CN:
            description: 经授权的结果。
        headers: &id001
          X-Trace-Id:
            description: Trace correlation matching envelope traceId.
            x-i18n:
              en-US:
                description: Trace correlation matching envelope traceId.
              zh-CN:
                description: 与响应 traceId 一致的关联标识。
            required: true
            schema: &id002
              type: string
              description: Request correlation identifier, including failures.
              x-i18n:
                en-US:
                  description: Request correlation identifier, including failures.
                zh-CN:
                  description: 包括失败请求在内的关联标识。
              pattern: ^[A-Za-z0-9-]{8,128}$
              maxLength: 128
          Cache-Control:
            description: Private control-plane responses must not be shared-cached.
            x-i18n:
              en-US:
                description: Private control-plane responses must not be shared-cached.
              zh-CN:
                description: 控制面私有响应不得共享缓存。
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/DataSourcePage
            examples:
              illustrative:
                summary: Illustrative contract value; not live execution.
                description: Illustrative contract value; not live execution.
                x-i18n:
