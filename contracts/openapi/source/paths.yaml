    x-source-visibility-authorization:
      ownerTransitions: []
      administratorTrigger: current visibility=ADMIN_PUBLIC
      additionalCapability: source.publish
      administratorIdentityRequired: true
      invariants:
      - Resolve current source ownership/proxy and visibility before reading ACL.
      - Administrator public source ACL additionally requires administrator identity and source.publish; do not expose service-account authority.
    x-resource-binding:
      primary: path.sourceId
      related: []
      invariants:
      - Read the authoritative exact current source ACL; PRIVATE has an empty shared ACL, never a provider credential or asset ACL.
      - Bound cursor to subject, source and source revision; reauthorize each page, reject stale or foreign cursors.
      - Grant entries do not convey source credential or administrator privileges; resulting asset access still intersects platform capability and asset/source policy.
