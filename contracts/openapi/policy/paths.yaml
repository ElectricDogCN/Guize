  post:
    operationId: createPolicy
    summary: Create a rule draft
    description: Create a rule draft
    x-i18n:
      en-US:
        description: Create a rule draft
        summary: Create a rule draft
      zh-CN:
        description: 创建规则草稿
        summary: 创建规则草稿
    tags:
    - policy
    security:
    - SessionCookie: []
    - BearerAuth: []
    x-module-id: MOD-POLICY
    x-requirement-ids:
    - REQ-V1-0007
    - REQ-V1-0009
    x-authorization:
      mode: AUTHENTICATED
      permission: policy.write
      scope: subject+resource ACL+source policy; deny before hydration; anonymous only explicit safe published assets
      stepUp: false
      approval: false
    x-error-codes:
    - AUTH_REQUIRED
    - AUTH_INVALID
    - ACCESS_DENIED
    - ACCESS_NOT_FOUND
    - INTERNAL_INVALID_REQUEST
    - INTERNAL_RATE_LIMITED
    - INTERNAL_UNAVAILABLE
    - INTERNAL_ERROR
    - POLICY_VALIDATION_FAILED
    - POLICY_APPROVAL_REQUIRED
    - INTERNAL_IDEMPOTENCY_CONFLICT
    - INTERNAL_IDEMPOTENCY_IN_PROGRESS
    - INTERNAL_REVISION_CONFLICT
    parameters:
    - name: Accept-Language
      in: header
      required: false
      description: Response language; unsupported language falls back to zh-CN.
      x-i18n:
        en-US:
          description: Response language; unsupported language falls back to zh-CN.
        zh-CN:
          description: 响应语言，不支持的语言回退至 zh-CN。
      schema:
        type: string
        enum:
        - zh-CN
        - en-US
        default: zh-CN
    - name: Idempotency-Key
      in: header
      required: true
      description: Caller+operation scoped key; same request replays original result for 24h.
      x-i18n:
        en-US:
          description: Caller+operation scoped key; same request replays original result for 24h.
        zh-CN:
          description: 按调用者与操作隔离，同请求在 24 小时内重放原结果。
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    - name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie sessions; machine bearer callers use scoped identity.
      x-i18n:
        en-US:
          description: Required for cookie sessions; machine bearer callers use scoped identity.
