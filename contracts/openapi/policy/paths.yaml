    - policy
    security:
    - SessionCookie: []
    - BearerAuth: []
    x-module-id: MOD-POLICY
    x-requirement-ids:
    - REQ-V1-0007
    - REQ-V1-0009
    x-authorization:
      mode: AUTHENTICATED
      permission: policy.validate
      scope: subject+resource ACL+source policy; deny before hydration; anonymous only explicit safe published assets
      stepUp: false
