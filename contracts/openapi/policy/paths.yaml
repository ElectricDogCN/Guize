/policies:
  get:
    operationId: listPolicies
    summary: List authorized versioned rules
    description: List authorized versioned rules
    x-i18n:
      en-US:
        description: List authorized versioned rules
        summary: List authorized versioned rules
      zh-CN:
        description: 列出经授权版本化规则
        summary: 列出经授权版本化规则
    tags:
    - policy
    security:
    - SessionCookie: []
    - BearerAuth: []
    x-module-id: MOD-POLICY
    x-requirement-ids:
    - REQ-V1-0007
    - REQ-V1-0009
    x-authorization:
      mode: AUTHENTICATED
      permission: policy.read
      scope: subject+resource ACL+source policy; deny before hydration; anonymous only explicit safe published assets
      stepUp: false
      approval: false
    x-error-codes:
    - AUTH_REQUIRED
    - AUTH_INVALID
    - ACCESS_DENIED
    - ACCESS_NOT_FOUND
    - INTERNAL_INVALID_REQUEST
    - INTERNAL_RATE_LIMITED
    - INTERNAL_UNAVAILABLE
    - INTERNAL_ERROR
    - POLICY_VALIDATION_FAILED
    - POLICY_APPROVAL_REQUIRED
    parameters:
    - name: Accept-Language
      in: header
      required: false
      description: Response language; unsupported language falls back to zh-CN.
      x-i18n:
        en-US:
          description: Response language; unsupported language falls back to zh-CN.
        zh-CN:
          description: 响应语言，不支持的语言回退至 zh-CN。
      schema:
        type: string
        enum:
        - zh-CN
        - en-US
        default: zh-CN
    - name: cursor
      in: query
      required: false
      description: Opaque scope-bound cursor.
      x-i18n:
        en-US:
          description: Opaque scope-bound cursor.
        zh-CN:
          description: 绑定权限范围的不透明游标。
      schema:
        type: string
        maxLength: 2048
    - name: limit
      in: query
      required: false
      description: Results per page, maximum 100.
      x-i18n:
        en-US:
          description: Results per page, maximum 100.
        zh-CN:
          description: 每页结果，最多 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    responses:
      '200':
        description: Authorized result.
        x-i18n:
          en-US:
            description: Authorized result.
          zh-CN:
            description: 经授权的结果。
        headers: &id001
          X-Trace-Id:
            description: Trace correlation matching envelope traceId.
            x-i18n:
              en-US:
                description: Trace correlation matching envelope traceId.
              zh-CN:
                description: 与响应 traceId 一致的关联标识。
            required: true
            schema: &id002
              type: string
              description: Request correlation identifier, including failures.
              x-i18n:
                en-US:
                  description: Request correlation identifier, including failures.
                zh-CN:
                  description: 包括失败请求在内的关联标识。
              pattern: ^[A-Za-z0-9-]{8,128}$
              maxLength: 128
          Cache-Control:
            description: Private control-plane responses must not be shared-cached.
            x-i18n:
              en-US:
                description: Private control-plane responses must not be shared-cached.
              zh-CN:
                description: 控制面私有响应不得共享缓存。
            schema:
              type: string
              const: no-store
            required: true
        content:
          application/json:
            schema:
              $ref: ../common/schemas.yaml#/VersionedDraftPage
            examples:
              illustrative:
                summary: Illustrative contract value; not live execution.
                description: Illustrative contract value; not live execution.
                x-i18n:
                  en-US:
                    description: Illustrative contract value; not live execution.
                    summary: Illustrative contract value; not live execution.
                  zh-CN:
                    description: 契约说明值，不是线上执行结果。
                    summary: 契约说明值，不是线上执行结果。
                value:
                  code: SUCCESS
                  message: 操作成功。
                  data:
                    items:
                    - id: cfg_example01
                      name: Example configuration
                      revision: 1
                      schemaVersion: 1
                      state: DRAFT
                    nextCursor: null
                  traceId: trace-example-0001
      '400':
        description: Redacted failure; stable codes only.
        x-i18n:
