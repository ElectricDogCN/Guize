              value:
                expectedRevision: 3
                approvalId: apr_example01
                reason: Restore approved retained revision 1
                targetRevision: 1
    x-long-running: true
    x-rollback-binding:
      current: body.expectedRevision
      target: body.targetRevision
      invariants:
      - Target is immutable and belongs to the path resource; reject missing, foreign or incompatible targets before effects.
      - Approval binds both revisions and the complete rollback body. Current revision is atomically compared; no implicit previous/latest selection.
      - Revalidate target against current security policy and deployment compatibility; keep history and audit, never overwrite the historical revision.
