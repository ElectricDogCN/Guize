    x-long-running: true
    x-assistant-boundary:
      input: Server-retained exact configuration revision and authorized redacted context; reject stale revision before queueing. Never send inline Secrets or inaccessible data to a provider.
      execution: Record immutable model/prompt/parameters/input snapshot, enforce provider/data policy, timeout and hard budget, persist task before effects; replay rechecks access and never duplicates inference.
      output: Validate/redact report and proposed draft against the bound schema and semantic policy. Keep output private and immutable; no automatic mutation, privilege change, deployment or publication.
      adoption: Caller must explicitly submit permitted draft through ordinary create/replace configuration, schema/semantic validation, simulation, separate approval and publish workflow. Assistant success is not validation success.
