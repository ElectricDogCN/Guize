/configurations/{configurationId}/versions/{revision}/content:
  get:
    operationId: getConfigurationContent
    summary: Read authorized exact redacted configuration content
    description: Read authorized exact redacted configuration content
    x-i18n:
      en-US:
        description: Read authorized exact redacted configuration content
        summary: Read authorized exact redacted configuration content
      zh-CN:
        description: 读取经授权的精确脱敏配置正文
