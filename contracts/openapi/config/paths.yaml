    x-idempotency:
      scope: authenticated subject (or pre-auth client session)+operationId+key
      fingerprint: SHA-256 of canonical method+normalized path resource IDs+query+body; identity is server-derived
      retentionSeconds: 86400
      samePayload: replay durable non-sensitive result only after current authorization
      differentPayload: INTERNAL_IDEMPOTENCY_CONFLICT, including a different path resource
      inFlight: INTERNAL_IDEMPOTENCY_IN_PROGRESS; retry after bounded backoff.
      reauthorization: recheck current authentication, resource/source ACL, step-up and approval validity before replay
      expiredEphemeralResult: never replay expired session/proof/grant; require a fresh key and reauthorization; no renewed side effect
      durability: transactional unique claim; task dedupe survives workflow retries
    requestBody:
      required: true
      description: Schema-validated bounded input.
      x-i18n:
        en-US:
          description: Schema-validated bounded input.
        zh-CN:
          description: 经 Schema 校验的有界输入。
      content:
        application/json:
          schema:
            $ref: ../common/schemas.yaml#/WorkerHeartbeat
          examples:
            illustrative:
              summary: Illustrative contract value; not live execution.
              description: Illustrative contract value; not live execution.
              x-i18n:
                en-US:
                  description: Illustrative contract value; not live execution.
                  summary: Illustrative contract value; not live execution.
                zh-CN:
                  description: 契约说明值，不是线上执行结果。
                  summary: 契约说明值，不是线上执行结果。
              value:
                workerId: wrk_example01
                leaseId: lse_example01
                diskFreeBytes: 1000000000000
    x-worker-credential-binding:
      audience: guize-worker-control
      subject: server authenticated bootstrap enrollment or worker credential; must own body.workerId
      resource: body.workerId + body.leaseId on heartbeat
      maxLifetimeSeconds: 300
      issuance: Lease response credential binds workerId, leaseId and expiresAt exactly; expiration is at most 300 seconds from issue and never beyond approved bootstrap enrollment.
      renewal: Heartbeat verifies worker.self, audience, current lease, revocation and expiry before renewal; rotate token, revoke replaced token, never extend enrollment or capability scope.
      replay: Recheck current authorization before replay; an expired or revoked token result is not renewed by replay. Use a fresh key and current identity; expired worker identity re-registers via bootstrap.
