    description: Validate an exact immutable revision
    x-i18n:
      en-US:
        description: Validate an exact immutable revision
        summary: Validate an exact immutable revision
      zh-CN:
        description: 校验精确不可变修订版本
        summary: 校验精确不可变修订版本
    tags:
    - config
    security:
    - SessionCookie: []
    - BearerAuth: []
    x-module-id: MOD-CONFIG
    x-requirement-ids:
    - REQ-V1-0009
    x-authorization:
      mode: AUTHENTICATED
      permission: config.validate
      scope: subject+resource ACL+source policy; deny before hydration; anonymous only explicit safe published assets
      stepUp: false
      approval: false
    x-error-codes:
    - AUTH_REQUIRED
    - AUTH_INVALID
    - ACCESS_DENIED
    - ACCESS_NOT_FOUND
    - INTERNAL_INVALID_REQUEST
    - INTERNAL_RATE_LIMITED
    - INTERNAL_UNAVAILABLE
    - INTERNAL_ERROR
    - POLICY_VALIDATION_FAILED
    - POLICY_APPROVAL_REQUIRED
    - DEPLOYMENT_BUNDLE_INVALID
    - INTERNAL_IDEMPOTENCY_CONFLICT
    - INTERNAL_IDEMPOTENCY_IN_PROGRESS
    - INTERNAL_REVISION_CONFLICT
    parameters:
    - name: Accept-Language
      in: header
      required: false
      description: Response language; unsupported language falls back to zh-CN.
      x-i18n:
        en-US:
          description: Response language; unsupported language falls back to zh-CN.
        zh-CN:
          description: 响应语言，不支持的语言回退至 zh-CN。
      schema:
        type: string
        enum:
        - zh-CN
        - en-US
        default: zh-CN
    - name: configurationId
      in: path
      required: true
      description: Resource identifier or exact optimistic revision, resolved after authorization.
      x-i18n:
        en-US:
          description: Resource identifier or exact optimistic revision, resolved after authorization.
        zh-CN:
          description: 鉴权后解析的资源标识或精确乐观修订号。
      schema:
        type: string
        description: Opaque resource identifier; never a file path.
        x-i18n:
          en-US:
            description: Opaque resource identifier; never a file path.
          zh-CN:
            description: 不透明资源标识，不是文件路径。
        pattern: ^[a-z]{2,12}_[A-Za-z0-9_-]{1,64}$
        maxLength: 80
    - name: Idempotency-Key
      in: header
      required: true
      description: Caller+operation scoped key; same request replays original result for 24h.
      x-i18n:
        en-US:
          description: Caller+operation scoped key; same request replays original result for 24h.
        zh-CN:
          description: 按调用者与操作隔离，同请求在 24 小时内重放原结果。
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    - name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie sessions; machine bearer callers use scoped identity.
      x-i18n:
        en-US:
          description: Required for cookie sessions; machine bearer callers use scoped identity.
        zh-CN:
          description: Cookie 会话必须提供；机器 Bearer 使用受限身份。
      schema:
        type: string
        minLength: 32
        maxLength: 128
    responses:
      '202':
        description: Command accepted; poll task status.
        x-i18n:
