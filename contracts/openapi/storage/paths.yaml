/cache-entries:
  get:
    operationId: listCacheEntries
    summary: List complete-cache entries, not ATS replicas
    description: List complete-cache entries, not ATS replicas
    x-i18n:
      en-US:
        description: List complete-cache entries, not ATS replicas
        summary: List complete-cache entries, not ATS replicas
      zh-CN:
        description: 列出完整缓存条目，不把 ATS 视为副本
        summary: 列出完整缓存条目，不把 ATS 视为副本
