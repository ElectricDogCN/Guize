    - storage
    security:
    - SessionCookie: []
    - BearerAuth: []
    x-module-id: MOD-STORAGE
    x-requirement-ids:
    - REQ-V1-0003
    - REQ-V1-0008
    x-authorization:
      mode: AUTHENTICATED
      permission: storage.read
      scope: subject+resource ACL+source policy; deny before hydration; anonymous only explicit safe published assets
      stepUp: false
      approval: false
    x-error-codes:
